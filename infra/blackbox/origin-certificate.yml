# origin-certificate-probe(prom/blackbox-exporter)의 설정. public-edge-probe는 이미지 기본 설정을 그대로 쓰므로 이 파일에 없다.
# 형식은 blackbox_exporter v0.28.0의 CONFIGURATION.md와 example.yml(tls_connect)을 따른다.
modules:
  # 호스트 nginx가 443에서 내놓는 원 서버 인증서의 만료 시각(probe_ssl_earliest_cert_expiry)을 읽는다(platform#270).
  # Cloudflare 엣지 인증서가 아니라 원 서버 인증서여야 해서 공개 주소가 아니라 호스트에 직접 TLS 핸드셰이크만 한다.
  # 만료된 인증서에서도 만료 시각을 읽어야 하므로 검증은 건너뛴다. 어떤 이름을 요청하든 같은 인증서가 나가지만
  # nginx server 블록과 맞추려고 SNI를 서비스 호스트로 고정한다.
  origin_tls_expiry:
    prober: tcp
    tcp:
      preferred_ip_protocol: "ip4"
      tls: true
      tls_config:
        server_name: easysubway-api.aquilaxk.site
        insecure_skip_verify: true
