services:
  postgres:
    image: imresamu/postgis:18-3.6@sha256:b5766ee720aca09c61b9a868abefbf273348a4b90ad4cf146b4f8c9ac85d48e4
    container_name: easysubway-postgres-local
    environment:
      POSTGRES_DB: ${EASYSUBWAY_POSTGRES_DB:-easysubway}
      POSTGRES_USER: ${EASYSUBWAY_POSTGRES_USER:-easysubway}
      POSTGRES_PASSWORD: ${EASYSUBWAY_POSTGRES_PASSWORD:-easysubway_local}
    ports:
      - "${EASYSUBWAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  object-storage:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: easysubway-object-storage-local
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${EASYSUBWAY_OBJECT_STORAGE_ACCESS_KEY:-easysubway_local}
      MINIO_ROOT_PASSWORD: ${EASYSUBWAY_OBJECT_STORAGE_SECRET_KEY:-easysubway_local_secret}
    ports:
      - "${EASYSUBWAY_OBJECT_STORAGE_PORT:-9000}:9000"
      - "${EASYSUBWAY_OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  object-storage-data:
