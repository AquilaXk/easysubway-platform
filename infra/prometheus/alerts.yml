groups:
  - name: easysubway-observability
    rules:
      - alert: AquilaPublicEdgeProbeScrapeDown
        expr: min(up{job="public_edge_probe"}) < 1
        for: 5m
        labels:
          severity: warning
          service: aquila-public-edge-probe
        annotations:
          summary: Public edge probe scrape is down
          description: Prometheus cannot scrape public_edge_probe for 5m. Check the exporter container, live probe refresh loop, and network path.
          title_ko: "공개 접속 점검 실패"
          impact_ko: "외부에서 API readiness를 확인하는 관측 신호가 멈췄습니다."
          action_ko: "public-edge-probe 컨테이너 상태와 외부 HTTPS readiness 응답을 확인하세요."

      - alert: AquilaDockerRuntimeProbeScrapeDown
        expr: min(up{job="docker_runtime_probe"}) < 1
        for: 3m
        labels:
          severity: warning
          service: aquila-docker-runtime-probe
        annotations:
          summary: docker runtime probe scrape is down
          description: Prometheus cannot scrape docker_runtime_probe for 3m. Check probe container health and docker socket access.
          title_ko: "Docker 런타임 점검 실패"
          impact_ko: "컨테이너 상태 관측 신호가 멈춰 Docker 기반 장애 탐지가 늦어질 수 있습니다."
          action_ko: "docker-runtime-probe 컨테이너 상태와 Docker socket 접근 권한을 확인하세요."

      - alert: AquilaBackWorkerScrapeDown
        expr: min(up{job="back_worker"}) < 1
        for: 3m
        labels:
          severity: critical
          service: aquila-back-worker
        annotations:
          summary: Back worker metrics scrape is down
          description: Prometheus cannot scrape the backend worker target for 3m. Task queue and DLQ alerts may stop evaluating.
          title_ko: "백그라운드 작업자 상태 점검 실패"
          impact_ko: "작업 큐와 DLQ 관련 알림 평가가 늦거나 멈출 수 있습니다."
          action_ko: "back-worker 컨테이너 상태와 /actuator/health/readiness 응답을 확인하세요."

      # dead-man's switch(#2376): backend_app_metrics scrape가 멈추면 아래 freshness 경보가 참조하는
      # easysubway_timetable_snapshot_remaining_seconds 시계열이 사라져 T-24h/T-6h 경보가 조용히 평가를
      # 멈춘다. 이 경보가 그 무음 상태 자체를 감시한다.
      - alert: AquilaBackendAppMetricsScrapeDown
        expr: min(up{job="backend_app_metrics"}) < 1
        for: 5m
        labels:
          severity: critical
          service: aquila-backend-app-metrics
        annotations:
          summary: Backend app metrics scrape is down
          description: Prometheus cannot scrape backend_app_metrics (backend:8080/actuator/prometheus) for 5m. The timetable snapshot freshness gauge disappears, so the T-24h/T-6h freshUntil alerts silently stop evaluating (dead-man's switch).
          title_ko: "백엔드 앱 메트릭 수집 실패"
          impact_ko: "운행표 snapshot 잔여시간 게이지가 사라져 만료 24/6시간 전 경보가 조용히 멈춥니다."
          action_ko: "backend 컨테이너 상태와 /actuator/prometheus 응답, docker network 내부 backend:8080 접근을 확인하세요."

      # 이 시계열은 backend actuator 메트릭에서 라이브로 scrape된다(#2376): prometheus.yml의
      # backend_app_metrics job이 docker network 내부 backend:8080/actuator/prometheus 를 직접 수집한다.
      # actuator는 공개 노출하지 않고 nginx 공개 경로에서 /actuator/* 를 차단하되 readiness/liveness probe만
      # 예외로 둔다. .github/workflows/timetable-auto-refresh.yml의 T-24h/T-6h Slack 통지는 보완 경보로
      # 병행 유지된다.
      - alert: TimetableSnapshotFreshnessExpiringT24h
        expr: min(easysubway_timetable_snapshot_remaining_seconds) <= 86400 and min(easysubway_timetable_snapshot_remaining_seconds) > 21600
        for: 5m
        labels:
          severity: warning
          service: aquila-timetable-snapshot
        annotations:
          summary: Timetable snapshot freshUntil expires within 24 hours
          description: The server timetable snapshot freshUntil deadline is less than 24h away. The automatic re-collection workflow must have already run; owner regeneration/deploy may still be required.
          title_ko: "운행표 snapshot 만료 24시간 전"
          impact_ko: "재수집·재산출이 완료되지 않으면 만료 후 재시작 시 부팅 실패 위험이 있습니다."
          action_ko: "timetable-auto-refresh 워크플로 실행 결과를 확인하고, UNCHANGED_AUTO 승격 산출물로 재산출·배포를 진행하세요."

      - alert: TimetableSnapshotFreshnessExpiringT6h
        expr: min(easysubway_timetable_snapshot_remaining_seconds) <= 21600
        for: 5m
        labels:
          severity: critical
          service: aquila-timetable-snapshot
        annotations:
          summary: Timetable snapshot freshUntil expires within 6 hours
          description: The server timetable snapshot freshUntil deadline is less than 6h away or already passed. Regeneration and deploy of a refreshed snapshot are required before expiry.
          title_ko: "운행표 snapshot 만료 6시간 전"
          impact_ko: "만료 시점 이후 재시작하면 부팅 hard fail로 서비스 중단 위험이 있습니다."
          action_ko: "즉시 재산출된 snapshot을 배포하거나 break-glass override 절차를 검토하세요."
