groups:
  - name: easysubway-observability
    rules:
      - alert: AquilaPublicEdgeProbeScrapeDown
        expr: min(up{job="public_edge_probe"}) < 1
        for: 5m
        labels:
          severity: warning
          service: aquila-public-edge-probe
        annotations:
          summary: Public edge probe scrape is down
          description: Prometheus cannot scrape public_edge_probe for 5m. Check the exporter container, live probe refresh loop, and network path.
          title_ko: "공개 접속 점검 실패"
          impact_ko: "외부에서 API readiness를 확인하는 관측 신호가 멈췄습니다."
          action_ko: "public-edge-probe 컨테이너 상태와 외부 HTTPS readiness 응답을 확인하세요."

      - alert: AquilaDockerRuntimeProbeScrapeDown
        expr: min(up{job="docker_runtime_probe"}) < 1
        for: 3m
        labels:
          severity: warning
          service: aquila-docker-runtime-probe
        annotations:
          summary: docker runtime probe scrape is down
          description: Prometheus cannot scrape docker_runtime_probe for 3m. Check probe container health and docker socket access.
          title_ko: "Docker 런타임 점검 실패"
          impact_ko: "컨테이너 상태 관측 신호가 멈춰 Docker 기반 장애 탐지가 늦어질 수 있습니다."
          action_ko: "docker-runtime-probe 컨테이너 상태와 Docker socket 접근 권한을 확인하세요."

      # dead-man's switch(Hub Issue #2376): backend_app_metrics scrape가 멈추면 아래 freshness 경보가 참조하는
      # easysubway_timetable_snapshot_remaining_seconds 시계열이 사라져 T-24h/T-6h 경보가 조용히 평가를
      # 멈춘다. 이 경보가 그 무음 상태 자체를 감시한다.
      - alert: AquilaBackendAppMetricsScrapeDown
        expr: min(up{job="backend_app_metrics"}) < 1
        for: 5m
        labels:
          severity: critical
          service: aquila-backend-app-metrics
        annotations:
          summary: Backend app metrics scrape is down
          description: Prometheus cannot scrape backend_app_metrics (K3s journey-active Service /actuator/prometheus) for 5m. The timetable snapshot freshness gauge disappears, so the T-24h/T-6h freshUntil alerts silently stop evaluating (dead-man's switch).
          title_ko: "백엔드 앱 메트릭 수집 실패"
          impact_ko: "운행표 snapshot 잔여시간 게이지가 사라져 만료 24/6시간 전 경보가 조용히 멈춥니다."
          action_ko: "K3s journey-active Service의 활성 pod 상태와 /actuator/prometheus 응답, compose 네트워크에서 Service ClusterIP:8080 접근(NetworkPolicy)을 확인하세요."

      # Issue #221 F4: easysubway-backend job의 up은 blackbox exporter 자체 상태만 나타내므로, 활성 K3s Service로의
      # readiness probe 실패(pod 미준비·NetworkPolicy 차단)는 probe_success로 따로 감시한다. dead-man 경보와 별개다.
      - alert: AquilaBackendReadinessProbeFailed
        expr: min(probe_success{job="easysubway-backend"}) < 1
        for: 5m
        labels:
          severity: critical
          service: aquila-backend-readiness
        annotations:
          summary: Backend readiness probe is failing
          description: The blackbox readiness probe to the active K3s journey-active Service has failed for 5m. The active backend is not ready or the compose-to-ClusterIP path (NetworkPolicy) is blocked.
          title_ko: "백엔드 readiness 점검 실패"
          impact_ko: "활성 K3s backend가 준비되지 않았거나 관측 경로가 막혀 backend 상태를 확인할 수 없습니다."
          action_ko: "journey-active Service의 활성 pod 상태와 /actuator/health/readiness 응답, compose 네트워크에서 ClusterIP:8080 접근(NetworkPolicy)을 확인하세요."

      # 이 시계열은 backend actuator 메트릭에서 라이브로 scrape된다(Hub Issue #2376): prometheus.yml의
      # backend_app_metrics job이 활성 K3s journey-active Service의 /actuator/prometheus 를 직접 수집한다(Issue #221).
      # actuator는 공개 노출하지 않고 nginx 공개 경로에서 /actuator/* 를 차단하되 readiness/liveness probe만
      # 예외로 둔다. .github/workflows/timetable-auto-refresh.yml의 T-24h/T-6h Slack 통지는 보완 경보로
      # 병행 유지된다.
      - alert: TimetableSnapshotFreshnessExpiringT24h
        expr: min(easysubway_timetable_snapshot_remaining_seconds) <= 86400 and min(easysubway_timetable_snapshot_remaining_seconds) > 21600
        for: 5m
        labels:
          severity: warning
          service: aquila-timetable-snapshot
        annotations:
          summary: Timetable snapshot freshUntil expires within 24 hours
          description: The server timetable snapshot freshUntil deadline is less than 24h away. The automatic re-collection workflow must have already run; owner regeneration/deploy may still be required.
          title_ko: "운행표 snapshot 만료 24시간 전"
          impact_ko: "재수집·재산출이 완료되지 않으면 만료 후 재시작 시 부팅 실패 위험이 있습니다."
          action_ko: "timetable-auto-refresh 워크플로 실행 결과를 확인하고, UNCHANGED_AUTO 승격 산출물로 재산출·배포를 진행하세요."

      - alert: TimetableSnapshotFreshnessExpiringT6h
        expr: min(easysubway_timetable_snapshot_remaining_seconds) <= 21600
        for: 5m
        labels:
          severity: critical
          service: aquila-timetable-snapshot
        annotations:
          summary: Timetable snapshot freshUntil expires within 6 hours
          description: The server timetable snapshot freshUntil deadline is less than 6h away or already passed. Regeneration and deploy of a refreshed snapshot are required before expiry.
          title_ko: "운행표 snapshot 만료 6시간 전"
          impact_ko: "만료 시점 이후 재시작하면 부팅 hard fail로 서비스 중단 위험이 있습니다."
          action_ko: "즉시 재산출된 snapshot을 배포하거나 break-glass override 절차를 검토하세요."

      # Hub Issue #2434 WP4: multi-window 5xx burn-rate (SLO 99.9% → error budget 0.001).
      # SLI = 5xx rate / total request rate. Traffic guard: long-window rate * 60 > 1 (≈ >1 req/min).
      - alert: Backend5xxBurnRateCritical
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[1h]))
            /
            sum(rate(http_server_requests_seconds_count[1h]))
          ) > (14.4 * 0.001)
          and
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) > (14.4 * 0.001)
          and
          sum(rate(http_server_requests_seconds_count[1h])) * 60 > 1
        for: 2m
        labels:
          severity: critical
          service: aquila-backend-5xx
        annotations:
          summary: Backend 5xx burn rate exceeds critical multi-window threshold
          description: 5xx error ratio burn rate is above 14.4x the 0.001 error budget on both the 1h and 5m windows, with traffic above 1 req/min on the 1h window.
          title_ko: "백엔드 5xx 버짓 소진 긴급"
          impact_ko: "짧은 시간에 오류 예산이 빠르게 소진되고 있어 사용자 요청 실패가 급증했을 수 있습니다."
          action_ko: "Grafana '오류 조회' 대시보드에서 5xx 비율·버짓 소진과 ERROR 로그를 확인한 뒤, /admin/api/errors로 동일 구간 오류를 대조 확인하세요."

      - alert: Backend5xxBurnRateWarning
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[6h]))
            /
            sum(rate(http_server_requests_seconds_count[6h]))
          ) > (6 * 0.001)
          and
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[30m]))
            /
            sum(rate(http_server_requests_seconds_count[30m]))
          ) > (6 * 0.001)
          and
          sum(rate(http_server_requests_seconds_count[6h])) * 60 > 1
        for: 2m
        labels:
          severity: warning
          service: aquila-backend-5xx
        annotations:
          summary: Backend 5xx burn rate exceeds warning multi-window threshold
          description: 5xx error ratio burn rate is above 6x the 0.001 error budget on both the 6h and 30m windows, with traffic above 1 req/min on the 6h window.
          title_ko: "백엔드 5xx 버짓 소진 주의"
          impact_ko: "중기 창에서 오류 예산 소진이 계속되면 SLO(99.9%) 위반으로 이어질 수 있습니다."
          action_ko: "Grafana '오류 조회' 대시보드에서 5xx 비율·버짓 소진과 ERROR 로그를 확인한 뒤, /admin/api/errors로 동일 구간 오류를 대조 확인하세요."

      - alert: Backend5xxBurnRateTicket
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[3d]))
            /
            sum(rate(http_server_requests_seconds_count[3d]))
          ) > (1 * 0.001)
          and
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[6h]))
            /
            sum(rate(http_server_requests_seconds_count[6h]))
          ) > (1 * 0.001)
          and
          sum(rate(http_server_requests_seconds_count[3d])) * 60 > 1
        for: 2m
        labels:
          severity: info
          service: aquila-backend-5xx
        annotations:
          summary: Backend 5xx burn rate exceeds ticket multi-window threshold
          description: 5xx error ratio burn rate is above 1x the 0.001 error budget on both the 3d and 6h windows, with traffic above 1 req/min on the 3d window.
          title_ko: "백엔드 5xx 버짓 소진 티켓"
          impact_ko: "장기 창에서 오류 예산이 소진되고 있어 추적·개선 작업이 필요합니다."
          action_ko: "Grafana '오류 조회' 대시보드에서 5xx 비율·버짓 소진과 ERROR 로그를 확인한 뒤, /admin/api/errors로 동일 구간 오류를 대조 확인하세요."


  # Journey V3 검색 지연 SLO(Platform Issue #235, backend#494 지표 계약).
  # SLO = 모드별로 28일 동안 ok·no_route 검색의 99%가 임계 시간 안에 끝난다(오류 예산 0.01). 임계 시간은 히스토그램 버킷
  # 경계 le로 고정된다: depart_at 0.025s, arrive_by·last_connection 0.25s, depart_between 0.5s
  # (backend JourneySearchLatencyMetrics.SLO_BUCKET_BOUNDS_MILLIS와 같은 값. 한쪽만 바꾸면 안 된다).
  # SLI = 임계 le 버킷 증가율 / 전체 증가율. outcome은 ok|no_route만 센다. fail_closed·error(5xx 포함)는 가용성이라
  # 위 5xx 경보가 맡는다. 결과는 mode 라벨별이다. 창이 겹치는 규칙이 많아 창별 불량 비율을 recording rule로 한 번만
  # 계산하고 경보는 그 시계열을 읽는다. 같은 그룹 안에서 recording rule이 경보보다 먼저 평가된다.
  - name: easysubway-journey-latency-slo
    rules:
      - record: easysubway:journey_search_latency_bad_ratio:rate5m
        expr: |
          1 - (
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome=~"ok|no_route",le="0.025"}[5m]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode=~"arrive_by|last_connection",outcome=~"ok|no_route",le="0.25"}[5m]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome=~"ok|no_route",le="0.5"}[5m]))
          )
          /
          sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[5m]))

      - record: easysubway:journey_search_latency_bad_ratio:rate30m
        expr: |
          1 - (
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome=~"ok|no_route",le="0.025"}[30m]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode=~"arrive_by|last_connection",outcome=~"ok|no_route",le="0.25"}[30m]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome=~"ok|no_route",le="0.5"}[30m]))
          )
          /
          sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[30m]))

      - record: easysubway:journey_search_latency_bad_ratio:rate1h
        expr: |
          1 - (
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome=~"ok|no_route",le="0.025"}[1h]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode=~"arrive_by|last_connection",outcome=~"ok|no_route",le="0.25"}[1h]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome=~"ok|no_route",le="0.5"}[1h]))
          )
          /
          sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[1h]))

      - record: easysubway:journey_search_latency_bad_ratio:rate6h
        expr: |
          1 - (
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome=~"ok|no_route",le="0.025"}[6h]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode=~"arrive_by|last_connection",outcome=~"ok|no_route",le="0.25"}[6h]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome=~"ok|no_route",le="0.5"}[6h]))
          )
          /
          sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[6h]))

      - record: easysubway:journey_search_latency_bad_ratio:rate3d
        expr: |
          1 - (
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome=~"ok|no_route",le="0.025"}[3d]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode=~"arrive_by|last_connection",outcome=~"ok|no_route",le="0.25"}[3d]))
            or
            sum by (mode) (rate(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome=~"ok|no_route",le="0.5"}[3d]))
          )
          /
          sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[3d]))

      - record: easysubway:journey_search_sli_requests:rate1h
        expr: sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[1h]))

      - record: easysubway:journey_search_sli_requests:rate6h
        expr: sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[6h]))

      - record: easysubway:journey_search_sli_requests:rate3d
        expr: sum by (mode) (rate(easysubway_journey_search_duration_seconds_count{job="backend_app_metrics",outcome=~"ok|no_route"}[3d]))

      # 아래 경보는 불량 비율이 NaN(트래픽 0의 0/0)이거나 recording rule 시계열이 없으면 비교가 거짓이라 조용하다.
      # 입력 시계열 부재는 BackendJourneyLatencySliMissing이 따로 드러낸다.
      - alert: BackendJourneyLatencyBurnRateCritical
        expr: |
          easysubway:journey_search_latency_bad_ratio:rate1h > (14.4 * 0.01)
          and
          easysubway:journey_search_latency_bad_ratio:rate5m > (14.4 * 0.01)
          and
          easysubway:journey_search_sli_requests:rate1h * 60 > 1
        for: 2m
        labels:
          severity: critical
          service: aquila-journey-latency
        annotations:
          summary: Journey search latency burn rate exceeds critical multi-window threshold
          description: "{{ $labels.mode }} search latency burn rate is above 14.4x the 0.01 error budget (share of ok/no_route searches slower than the mode SLO threshold) on both the 1h and 5m windows, with traffic above 1 req/min on the 1h window. SLO thresholds: depart_at 25 ms, arrive_by and last_connection 250 ms, depart_between 500 ms."
          title_ko: "경로 검색 지연 버짓 소진 긴급"
          impact_ko: "짧은 시간에 지연 SLO(99%) 오류 예산이 빠르게 소진되고 있어 해당 모드의 경로 검색 응답이 느려졌을 수 있습니다."
          action_ko: "Grafana 'Journey 검색 지연 SLO' 대시보드에서 해당 모드의 지연 분포와 요청량을 확인하고, 최근 backend 배포·번들 활성화와 엔진 자원 포화 여부를 점검하세요."

      - alert: BackendJourneyLatencyBurnRateWarning
        expr: |
          easysubway:journey_search_latency_bad_ratio:rate6h > (6 * 0.01)
          and
          easysubway:journey_search_latency_bad_ratio:rate30m > (6 * 0.01)
          and
          easysubway:journey_search_sli_requests:rate6h * 60 > 1
        for: 2m
        labels:
          severity: warning
          service: aquila-journey-latency
        annotations:
          summary: Journey search latency burn rate exceeds warning multi-window threshold
          description: "{{ $labels.mode }} search latency burn rate is above 6x the 0.01 error budget (share of ok/no_route searches slower than the mode SLO threshold) on both the 6h and 30m windows, with traffic above 1 req/min on the 6h window. SLO thresholds: depart_at 25 ms, arrive_by and last_connection 250 ms, depart_between 500 ms."
          title_ko: "경로 검색 지연 버짓 소진 주의"
          impact_ko: "중기 창에서 지연 오류 예산 소진이 계속되면 해당 모드의 지연 SLO(99%) 위반으로 이어질 수 있습니다."
          action_ko: "Grafana 'Journey 검색 지연 SLO' 대시보드에서 해당 모드의 지연 분포와 요청량을 확인하고, 최근 backend 배포·번들 활성화와 엔진 자원 포화 여부를 점검하세요."

      - alert: BackendJourneyLatencyBurnRateTicket
        expr: |
          easysubway:journey_search_latency_bad_ratio:rate3d > (1 * 0.01)
          and
          easysubway:journey_search_latency_bad_ratio:rate6h > (1 * 0.01)
          and
          easysubway:journey_search_sli_requests:rate3d * 60 > 1
        for: 2m
        labels:
          severity: info
          service: aquila-journey-latency
        annotations:
          summary: Journey search latency burn rate exceeds ticket multi-window threshold
          description: "{{ $labels.mode }} search latency burn rate is above 1x the 0.01 error budget (share of ok/no_route searches slower than the mode SLO threshold) on both the 3d and 6h windows, with traffic above 1 req/min on the 3d window. SLO thresholds: depart_at 25 ms, arrive_by and last_connection 250 ms, depart_between 500 ms."
          title_ko: "경로 검색 지연 버짓 소진 티켓"
          impact_ko: "장기 창에서 지연 오류 예산이 소진되고 있어 추적·개선 작업이 필요합니다."
          action_ko: "Grafana 'Journey 검색 지연 SLO' 대시보드에서 해당 모드의 지연 분포와 요청량을 확인하고, 최근 backend 배포·번들 활성화와 엔진 자원 포화 여부를 점검하세요."

      # 지표 누락 경보: SLI가 읽는 8개 시계열(4 모드 x ok·no_route, 각 모드의 SLO le 경계)이 하나라도 없으면 위 burn-rate
      # 경보는 식이 비어 조용해진다. backend는 시작할 때 16개 시계열을 0건으로 등록하므로 트래픽이 없어도 시계열은 있어야 한다.
      # 값은 없는 시계열 수다. scrape 자체가 죽은 경우(up < 1)는 AquilaBackendAppMetricsScrapeDown이 맡으므로 중복 발화하지
      # 않는다. up 시계열이 아예 없으면 억제하지 않아 그대로 발화한다. backend 지표 배포 전에 이 규칙이 먼저 활성화되면
      # 발화하므로 backend를 먼저 배포한다.
      - alert: BackendJourneyLatencySliMissing
        expr: |
          sum(
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome="ok",le="0.025"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_at",outcome="no_route",le="0.025"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="arrive_by",outcome="ok",le="0.25"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="arrive_by",outcome="no_route",le="0.25"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="last_connection",outcome="ok",le="0.25"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="last_connection",outcome="no_route",le="0.25"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome="ok",le="0.5"})
            or
            absent(easysubway_journey_search_duration_seconds_bucket{job="backend_app_metrics",mode="depart_between",outcome="no_route",le="0.5"})
          ) > 0
          unless on()
          (min(up{job="backend_app_metrics"}) < 1)
        for: 10m
        labels:
          severity: warning
          service: aquila-journey-latency
        annotations:
          summary: Journey search latency SLI series or SLO bucket boundary is missing
          description: "backend_app_metrics is not scrape-down, but at least one of the 8 histogram series that the journey latency SLO reads (modes x ok/no_route at the SLO le boundary) is absent, so the latency burn-rate alerts cannot evaluate. SLO thresholds: depart_at 25 ms, arrive_by and last_connection 250 ms, depart_between 500 ms."
          title_ko: "경로 검색 지연 지표 누락"
          impact_ko: "지연 SLO를 계산할 시계열이나 임계 버킷 경계가 없어 경로 검색 지연 경보가 평가되지 않습니다."
          action_ko: "backend가 /actuator/prometheus에 easysubway_journey_search_duration_seconds 히스토그램(mode·outcome 태그, SLO 버킷 0.025·0.25·0.5)을 노출하는지 확인하고, backend 버전과 platform 경보의 버킷 경계가 같은지 대조하세요."
