name: PBI / Sub-task
description: 한 저장소·한 owner가 완료할 수 있는 실행 작업을 등록합니다.
title: '[Feat] '
body:
- type: markdown
  attributes:
    value: '이 양식은 `Epic → PBI → 필요 시 Sub-task` 계층을 사용합니다.

      Platform은 IaC, protected environment, immutable deployment input, readiness·activation·rollback과 operations를 소유합니다.
      Data·Backend·Mobile 제품 구현과 Hub final decision은 소유하지 않습니다.

      같은 owner·같은 PR·같은 검증 경계의 작업은 한 PBI에 유지하고, 독립 owner 또는 독립 PR이 있을 때만 Sub-task를 만듭니다.

      기존 이슈 번호, 현재 작업 계획서, branch/worktree/PR 소유권은 유지합니다.'
- type: dropdown
  id: work_item_type
  attributes:
    label: 작업 단위
    description: 독립적인 결과를 내면 PBI, 기존 PBI 안의 독립 owner·PR 작업이면 Sub-task를 선택합니다.
    options:
    - PBI
    - Sub-task
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: 책임 영역
    options:
    - IaC / environment
    - Deploy / release input
    - Readiness / activation / rollback
    - Observability / DR / security
    - CI / tooling
  validations:
    required: true
- type: input
  id: parent
  attributes:
    label: 상위 Epic 또는 PBI
    description: Repository-qualified issue URL을 적습니다. 상위가 없으면 NONE.
    placeholder: 예) https://github.com/AquilaXk/easysubway/issues/2742
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: 목표 결과
    description: 완료 뒤 사용자 또는 시스템에 생기는 결과를 1~3개로 적습니다.
    placeholder: '- ...

      - ...'
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: 현재 문제
    description: 현재 동작과 실제 영향만 적습니다. 긴 설계 배경은 Tech Spec/ADR로 분리합니다.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 범위
    description: 이 PBI가 직접 바꾸는 컴포넌트·경계와 예상 PR 단위를 적습니다.
    placeholder: '- 포함:

      - 변경 경계:

      - 예상 PR:'
  validations:
    required: true
- type: input
  id: spec
  attributes:
    label: Tech Spec / ADR
    description: API·schema·DB·deploy·security 경계 또는 2일 이상 설계가 필요하면 링크합니다. 없으면 NONE.
    placeholder: NONE 또는 URL
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 의존성
    description: Blocked by / Blocks / Relates to만 적고 전체 프로젝트 DAG를 반복하지 않습니다.
    placeholder: '- Blocked by:

      - Blocks:

      - Relates to:'
- type: textarea
  id: ownership
  attributes:
    label: 작업 소유권·충돌 확인
    description: Accountable plan, owner, 현재 branch/worktree/PR, 겹치는 작업 여부를 적습니다.
    placeholder: '- Accountable plan: PLAN-DOC | PLAN-REPO | PLAN-JOURNEY | PLAN-QUALITY

      - Owner:

      - Existing branch/worktree/PR:

      - Overlap disposition:'
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건
    description: 결과 중심 체크리스트를 적습니다. child의 CI·Review를 parent에서 반복하지 않습니다.
    placeholder: '- [ ] 핵심 결과

      - [ ] 대표 실패 동작

      - [ ] 후행 owner가 소비할 handoff 또는 receipt'
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 검증
    description: Focused test와 required repository CI만 적습니다. 수동·device·deploy 검증은 실제 필요할 때만 추가합니다.
    placeholder: '- Focused:

      - Required CI:

      - Manual/device/deploy (필요한 경우만):'
  validations:
    required: true
- type: textarea
  id: out_of_scope
  attributes:
    label: 제외 범위
    description: 다른 저장소 구현, 후행 release gate와 이번 PBI에서 하지 않을 일을 적습니다.
  validations:
    required: true
- type: checkboxes
  id: ready
  attributes:
    label: 착수 전 확인
    options:
    - label: 기존 이슈·계획서·열린 PR·branch/worktree를 확인했고 현재 작업자의 경계를 합치거나 인수하지 않았습니다.
      required: true
    - label: 이 작업은 한 저장소·한 accountable owner·한 PR 경계로 완료 가능하며, 그렇지 않으면 독립 PBI/Sub-task로 분리합니다.
      required: true
    - label: Focused 검증 뒤 Draft PR을 열고, full suite와 Review는 repository의 PR gate에서 수행합니다.
      required: true
