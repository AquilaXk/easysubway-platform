name: PostgreSQL Restore Rehearsal (Disaster Recovery)

on:
  schedule:
    # Every Sunday at 03:30 KST (Saturday 18:30 UTC)
    - cron: "30 18 * * 6"
  workflow_dispatch:
    inputs:
      backup_file:
        description: "Explicit path to backup file to rehearse (optional, defaults to latest in backup directory)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  rehearse:
    name: Disaster Recovery Rehearsal
    runs-on:
      - self-hosted
      - easysubway-production
    timeout-minutes: 15
    concurrency:
      group: postgres-restore-rehearsal-production
      cancel-in-progress: false
    environment:
      name: production
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rehearse database backup restoration
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${DEPLOY_ROOT:-/opt/easysubway}"
          BACKUP_FILE="${{ github.event.inputs.backup_file }}"

          if [[ -z "${BACKUP_FILE}" ]]; then
            BACKUP_DIR="${DEPLOY_ROOT}/backups"
            if [[ ! -d "${BACKUP_DIR}" ]]; then
              echo "Backup directory ${BACKUP_DIR} not found; skipping rehearsal" >&2
              exit 0
            fi
            LATEST_BACKUP="$(find "${BACKUP_DIR}" -name "postgres-*.dump" -type f | sort -r | head -n 1)"
            if [[ -z "${LATEST_BACKUP}" ]]; then
              echo "No backup dump found in ${BACKUP_DIR}; skipping rehearsal" >&2
              exit 0
            fi
            BACKUP_FILE="${LATEST_BACKUP}"
          fi

          echo "Starting restore rehearsal with backup: ${BACKUP_FILE}"
          bash tools/ops/postgres-restore-rehearsal.sh "${BACKUP_FILE}"
          echo "Restore rehearsal completed successfully."
