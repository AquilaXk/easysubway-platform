name: PostgreSQL Restore Rehearsal (Disaster Recovery)

on:
  schedule:
    # Every Sunday at 03:30 KST (Saturday 18:30 UTC)
    - cron: "30 18 * * 6"
  workflow_dispatch:
    inputs:
      backup_file:
        description: "Explicit path to backup file to rehearse (optional, defaults to latest in backup directory)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  rehearse:
    name: Disaster Recovery Rehearsal
    runs-on:
      - self-hosted
      - easysubway-production
    timeout-minutes: 15
    concurrency:
      group: postgres-restore-rehearsal-production
      cancel-in-progress: false
    environment:
      name: production
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rehearse database backup restoration
        shell: bash
        env:
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_file }}
          EASYSUBWAY_BACKUP_DIR: /opt/easysubway/backups
        run: |
          set -euo pipefail

          if [[ ! -d "${EASYSUBWAY_BACKUP_DIR}" || -L "${EASYSUBWAY_BACKUP_DIR}" ]]; then
            echo "::error::Backup directory ${EASYSUBWAY_BACKUP_DIR} does not exist" >&2
            exit 1
          fi

          if [[ -z "${BACKUP_FILE_INPUT:-}" ]]; then
            LATEST_BACKUP="$(find "${EASYSUBWAY_BACKUP_DIR}" -maxdepth 1 -type f \( -name 'easysubway-postgres-*.dump' -o -name 'postgres-*.dump' \) | sort -r | head -n 1)"
            if [[ -z "${LATEST_BACKUP}" ]]; then
              echo "::error::No PostgreSQL backup dump found in ${EASYSUBWAY_BACKUP_DIR}" >&2
              exit 1
            fi
            BACKUP_FILE="${LATEST_BACKUP}"
          elif [[ "${BACKUP_FILE_INPUT}" != */* ]]; then
            BACKUP_FILE="${EASYSUBWAY_BACKUP_DIR}/${BACKUP_FILE_INPUT}"
          else
            BACKUP_FILE="${BACKUP_FILE_INPUT}"
          fi

          echo "Starting restore rehearsal with backup: ${BACKUP_FILE}"
          bash tools/ops/postgres-restore-rehearsal.sh "${BACKUP_FILE}"
          echo "Restore rehearsal completed successfully."
