name: Automerge Queue

# 다중 세션 병합 경합 해소용 best-effort FIFO 코디네이터.
# automerge 라벨이 붙은 PR을 오래된 순으로 훑되, 지금 병합할 수 없는 후보는 사유를 남기고
# 건너뛴다. 라벨은 merge-workflow 규약 4단계(코드리뷰 게이트) 완료 후에만 붙인다.
#
# 인증은 github.token 하나뿐이다. GITHUB_TOKEN이 만든 이벤트는 새 workflow run을
# 만들지 않고 예외는 workflow_dispatch와 repository_dispatch뿐이다. 이 저장소에서 그
# 제약에 걸리는 체인은 required context가 없는 same-repository PR의 CI 복구뿐이다.
# PR branch의 base 갱신은 원칙적으로 소유 세션이 한다. 예외는 AUTOMERGE_PAT가 있을 때 게이트를
# 모두 통과한 BEHIND 후보 하나이며(QA 결정 2026-09-29), coordinator가 PAT로 base 병합을 요청해
# CI가 붙게 한다. DIRTY와 PAT 없는 BEHIND는 지금처럼 소유 세션에 돌려보낸다.
# ci.yml의 main push 실행도 되살리지 않는다. 형제 저장소 실측(2026-08-02): backend·mobile
# coordinator 어느 쪽도 main CI를 dispatch하지 않고, 코디네이터가 병합한 SHA에는 main push
# CI 실행이 0건이다(mobile aacec74·d794582, backend 26b0b68. 세 PR 모두 mergedBy가
# app/github-actions). 사람이 병합한 SHA(mobile 226a220, backend 5045069)에만 push 실행이
# 있다. main ruleset이 strict required status checks라 PR head는 병합 직전 main과 동기화된
# 상태에서 검증되고 squash 결과 트리가 그 head와 같으므로, main push 실행은 같은 트리를 한 번
# 더 도는 셈이다. 네 저장소의 병합 경로를 일치시키기 위해 이 억제를 그대로 수용한다.
# 병합 후 실행되어야 하는 producer는 없다(2026-08-02 실측). cd.yml은 backend_image
# 입력이 필수인 운영자 dispatch 전용이고, sensitive-backup-retention.yml은 schedule
# 전용이며, ci.yml의 main push 실행은 artifact를 만들지 않는 사후 확인이다. 형제 저장소
# backend가 명시 dispatch로 이은 immutable image producer 같은 체인이 이 저장소에는
# 없다. push 트리거 producer가 새로 생기면 tools/ci/automerge-queue.test.mjs의
# "병합 후 dispatch가 필요한 producer가 없다" 계약이 깨져 이 판정을 다시 하게 된다.
# 트리거 공백은 schedule cron이 메운다.

on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [Platform CI]
    types: [completed]
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: automerge-queue
  cancel-in-progress: false

jobs:
  coordinate:
    name: Automerge Queue
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      # 병합 호출만 PAT로 수행한다(GITHUB_TOKEN 병합은 후속 workflow run을 만들지 않는다).
      MERGE_GH_TOKEN: ${{ secrets.AUTOMERGE_PAT != '' && secrets.AUTOMERGE_PAT || github.token }}
      HAS_AUTOMERGE_PAT: ${{ secrets.AUTOMERGE_PAT != '' }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_LABEL: ${{ github.event_name == 'pull_request_target' && github.event.label.name || '' }}
      EVENT_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
      EVENT_HEAD: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    steps:
      - name: Coordinate eligible pull requests
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail

          if [ "${HAS_AUTOMERGE_PAT}" != "true" ]; then
            echo "::warning::AUTOMERGE_PAT secret이 없어 GITHUB_TOKEN으로 병합한다. 병합이 후속 workflow run을 만들지 못해 큐 체인이 멈출 수 있다."
          fi

          repo="${GITHUB_REPOSITORY}"
          owner="${repo%%/*}"
          name="${repo#*/}"

          # frozen discovery를 current head까지 승계하는 권한은 automerge 라벨을 붙인
          # pull_request_target 이벤트에서만 남긴다. 이후 push/rebase는 SHA 불일치로
          # fail closed되고, closure 뒤 라벨을 다시 붙여 새 marker를 발행해야 한다.
          # marker는 PR당 canonical 1개로 수렴한다(PATCH-or-POST). 이전 방식이 쌓아 둔 여러
          # 개는 가장 오래된 하나를 새 head로, 나머지는 canonical이 아닌 superseded 본문으로
          # 바꿔 정리한다(삭제하지 않는다). comment는 3페이지와 overflow 확인 1회까지만 읽고,
          # 읽기·형식 실패나 초과는 marker를 건드리지 않고 이 실행을 실패시킨다.
          if [[ "${EVENT_NAME}" == "pull_request_target" && "${EVENT_LABEL}" == "automerge" ]]; then
            if [[ ! "${EVENT_PR}" =~ ^[0-9]+$ ]] ||
              [[ ! "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "automerge label event의 PR 또는 head SHA가 유효하지 않다." >&2
              exit 1
            fi
            label_marker="<!-- Automerge frozen discovery authorization: ${EVENT_HEAD} -->"
            label_comments='[]'
            for label_page in 1 2 3 4; do
              label_body="$(gh api "repos/${repo}/issues/${EVENT_PR}/comments?per_page=100&page=${label_page}")"
              jq -e 'type == "array" and all(.[]; type == "object")' <<<"${label_body}" >/dev/null
              if [[ "${label_page}" -eq 4 ]]; then
                jq -e 'length == 0' <<<"${label_body}" >/dev/null
                break
              fi
              label_comments="$(jq -c --argjson page_body "${label_body}" '. + $page_body' <<<"${label_comments}")"
              if [[ "$(jq 'length' <<<"${label_body}")" -lt 100 ]]; then
                break
              fi
            done
            label_marker_ids="$(jq -c '
              [.[] | select(
                (.user | type == "object") and
                .user.login == "github-actions[bot]" and
                .user.id == 41898282 and
                .user.type == "Bot" and
                (.body | type == "string") and
                (.body | test("^<!-- Automerge frozen discovery authorization: [0-9a-f]{40} -->$"))
              ) | .id] | sort
            ' <<<"${label_comments}")"
            jq -e 'all(.[]; type == "number")' <<<"${label_marker_ids}" >/dev/null
            if [[ "$(jq 'length' <<<"${label_marker_ids}")" -eq 0 ]]; then
              gh api --method POST "repos/${repo}/issues/${EVENT_PR}/comments" \
                -f body="${label_marker}"
            else
              gh api --method PATCH "repos/${repo}/issues/comments/$(jq -r '.[0]' <<<"${label_marker_ids}")" \
                -f body="${label_marker}"
              while IFS= read -r superseded_id; do
                gh api --method PATCH "repos/${repo}/issues/comments/${superseded_id}" \
                  -f body="<!-- Automerge frozen discovery authorization superseded -->"
              done < <(jq -r '.[1:][]' <<<"${label_marker_ids}")
            fi
          fi

          # required context는 main ruleset이 정본이다. 하드코딩 폴백을 두면 ruleset
          # 변경이나 조회 실패가 그대로 게이트 완화가 되므로 조회 실패는 fail closed다.
          # 후보마다 다시 물을 이유가 없어 루프 밖에서 한 번만 읽는다.
          rules="$(gh api "repos/${repo}/rules/branches/main")"
          required="$(jq -c '
            [.[] |
              select(.type == "required_status_checks") |
              .parameters.required_status_checks[] |
              {context, integration_id: (.integration_id // null)}] |
            unique_by(.context, .integration_id)
          ' <<<"${rules}")"
          jq -e 'length > 0' <<<"${required}" >/dev/null

          # draft는 선택 단계에서 걸러낸다. `gh pr list`는 draft를 필터하지 않는다.
          # 이 필터는 아래 창 산출보다 반드시 앞서야 한다. 뒤로 미루면 draft가 창 자리를
          # 차지해 한 실행에서 실제로 평가되는 후보 수가 window보다 줄어든다.
          candidates="$(gh pr list --repo "${repo}" --base main --state open --label automerge \
            --limit 1000 --json number,createdAt,isDraft \
            --jq '[.[] | select(.isDraft == false)] | [sort_by(.createdAt)[].number]')"

          # 큐는 strict FIFO가 아니라 best-effort FIFO다. 오래된 순으로 후보를 훑되 병합할 수
          # 없는 후보는 사유를 남기고 건너뛴다. head 하나만 처리하면 그 한 건이 막혔을 때 뒤의
          # PR이 전부 굶는다. 건너뛰기는 병합을 하지 않는 방향이라 게이트를 약화시키지 않으며,
          # 각 후보는 리뷰 객체·미해결 thread·required context 검증을 그대로 통과해야 한다.
          # 실제 병합은 한 실행에 최대 한 건이므로 병합 직렬화는 concurrency group과
          # 함께 그대로 유지된다.
          #
          # 병합할 수 없는 사유를 실행 종료 코드로 표현하지 않는다. exit 1은 큐 전체를 멈춰
          # 뒤의 후보를 굶기고, 그 실패가 이 워크플로의 check로 남아 다음 판정 입력을
          # 오염시킨다. 대신 사람이 봐야 하는 상태(BEHIND·DIRTY·fork head·미지 enum·
          # required context 실패)는 ::warning:: annotation으로 run 요약에 남긴다.
          # queue-loop-begin
          # 한 실행에서 평가할 후보 수에는 상한이 필요하다. 상한은 아래 세 기준을 모두
          # 만족해야 하고 가장 작은 쪽이 구속한다. 형제 저장소 상수를 그대로 옮기면 안 된다.
          #
          #  - API 예산 지분. GITHUB_TOKEN 한도는 저장소당 시간당 1,000회이고 이 저장소의
          #    다른 워크플로와 공유한다. 실행당 청구는 ruleset 1 + gh pr list 1 + 고정 비용
          #    16 + 후보당 24 * window_max이고, window_max=3이면 90회로 한도의 9.0%다. 이
          #    저장소에는 큐 밖에서 GITHUB_TOKEN REST를 상시로 쓰는 워크플로가 없다 —
          #    ci.yml은 raw.githubusercontent와 registry만 받고 API를 부르지 않으며, cd.yml과
          #    sensitive-backup-retention.yml은 운영자 dispatch·schedule 전용이다. 그래서
          #    형제 저장소 data(5.0%)보다는 넓게, 그러나 한 실행이 한도를 독점하지 않는
          #    8% 선 아래로 잡았다. 후보 한 건당 호출은 9회지만 요청은 그보다 많을 수 있다.
          #    `gh pr view --json`(GraphQL)과 reviewThreads(GraphQL)는 페이지네이션이 없고
          #    (reviewThreads는 first: 100 + hasNextPage fail closed), REST PR 1회와 files·reviews·
          #    comments·commits·check-runs·statuses(REST)는 페이지 상한 3(아래 paginated-read)까지 읽는다.
          #    Dependabot provenance actions-runs도 같은 3회 상한으로 청구한다. 그래서 후보당 청구는 24회다 — pr view 1 + reviewThreads 1 + REST PR 1 + REST 6종 * 3페이지 + actions-runs 3회. `--paginate`를
          #    쓰지 않는 이유가 이것이다: 페이지 수에 상한이 없으면 이력이 유난히 긴 후보
          #    하나가 예산 모델을 통째로 넘긴다. 상한을 넘는 후보는 판정을 포기하고 건너뛴다.
          #    required context별 jq는 로컬 계산이라 요청을 쓰지 않는다. 후보 평가 밖의 고정
          #    비용은 label marker 발행, PR-visible fail-closed 처리와 API 응답 변동을 덮는 보수적 여유 16회다.
          #    authorization marker 재발행·복구는 exact marker가 없는 후보에서만 REST를 더 쓴다
          #    (재발행 최대 3회: commit·compare·PATCH, 복구 최대 3회: events 2·POST 1, PR commit
          #    set은 위에서 이미 읽는다). head가 바뀐 뒤 한 번 성립하면 끝나는 드문 경로라 후보당
          #    청구에 넣지 않고, 후보마다의 잔량 재확인(budget-recheck)이 예약선을 지킨다.
          #
          #    이 예산을 "실행 빈도"로 나누지 않는다. 빈도는 강제되지 않는다 — concurrency
          #    그룹은 cancel-in-progress: false라 대기 중인 실행만 접을 뿐 실행이 시작되는
          #    빈도에는 상한을 두지 않고, 반대로 cron */10은 best-effort라 정시성을 약속하지
          #    않는다. 그래서 창은 가정이 아니라 남은 예산을 매 실행 실측해서 정한다.
          #    `GET /rate_limit`은 한도를 소비하지 않으므로 이 조회 자체가 공짜이고, 이 job이
          #    실제로 쓰는 토큰의 REST·GraphQL 잔량을 그대로 준다. 두 버킷의 최솟값에 후보당
          #    9회를 청구하면 실제 지출(REST 3 + 페이지, GraphQL 2)보다 많이 떼므로 어느 쪽
          #    버킷도 계산보다 먼저 마르지 않는다. 두 값 중 하나가 비정상이면 최솟값을 내지
          #    않고 큐를 건너뛴다 — 후보 평가는 두 버킷을 다 쓰므로 한쪽을 모르는 것은 예산
          #    전체를 모르는 것과 같다.
          #
          #    잔량에서 reserve를 먼저 뗀다. 이 저장소에는 큐가 지켜 줘야 할 producer
          #    dispatch 체인이 없지만, 큐가 공유 한도를 다 쓰면 코디네이터 자신의 다음 실행이
          #    창을 0으로 만들어 큐가 스스로를 굶기고 운영자의 cd.yml preflight dispatch와
          #    조회까지 함께 막힌다. 실행당 고정 비용은 18회(ruleset 1 + gh pr list 1 +
          #    고정 비용 16)이므로 200회면 최소 11회 실행분이 남는다.
          #  - job timeout. 이 job은 5분(300초)이고 branch 갱신 대기가 없으므로 고정 비용은
          #    러너·스텝 오버헤드 30초뿐이다. 남는 270초를 후보당 5회 * 1초(비관적 왕복)로
          #    나누면 54건이고, API가 느린 날을 감안해 2배 여유를 두면 27건이다.
          #  - 실측 큐 깊이. 2026-08-02 기준 이 저장소의 열린 PR은 6건이고(dependabot 5건 +
          #    사람 1건) 저장소 생성(2026-07-31) 이후 누적 PR은 10건이다. dependabot이 배치로
          #    PR을 만드는 저장소라 큐 깊이가 한 번에 5건까지 뛴다. 창 4면 그 배치의 대부분이
          #    한 실행에 들어오고, 남는 1건은 아래 회전이 다음 실행에서 집는다.
          #
          # 구속하는 쪽은 API 예산 지분이므로 window_max=3이고, 실제 창은 실행마다
          # min(window_max, (잔량 - reserve - 고정 비용) / 후보당 요청)으로 정한다. 잔량이
          # reserve에 닿으면 창이 0이 되어 이번 실행의 큐만 건너뛴다. 창을 정한 뒤에도 후보마다
          # 잔량을 다시 읽어 예약선에서 멈추므로, 창은 상한이지 지출 약속이 아니다. 형제 저장소
          # 값 6이나 20을 그대로 쓰면 실행당 청구가 각각 138회·478회로 위 지분 기준을 깬다.
          #
          # 다만 창을 큐 앞쪽에 고정하면 창 밖의 후보는 매 실행 제외되어, 없애려던 head
          # 차단이 1건에서 window건 규모로 옮겨갈 뿐이다. 그래서 창 시작점을 실행마다
          # 새로 고른다.
          #
          # 시작점은 실행 컨텍스트 값이 아니라 균등 난수로 뽑는다. 실행 컨텍스트 기반
          # 결정적 회전은 "실행 간격"에 취약하기 때문이다. 이 job은 automerge가 아닌 라벨
          # 이벤트에서 if 조건에 걸려 건너뛰고 concurrency가 대기 실행을 버리기도 하므로,
          # 실제 coordinator 실행 사이의 run number 간격 d는 1이 아니다. 시작점을 run
          # number의 함수로 두면 유효 보폭에 d가 곱해지고, gcd(유효 보폭, total) > window인
          # 조합에서 시작점이 고정된다(total = 2 * window, d가 그 약수인 시퀀스에서 앞쪽
          # window건만 영원히 평가되고 뒤쪽은 병합 준비가 끝나도 대기). 난수 시작점은 어떤
          # 값도 읽지 않으므로 이 취약점이 원리적으로 없다.
          #
          # 보장: 후보 하나가 한 실행에서 창에 들 확률은 window/total 이상이며 실행 간격·
          # 건너뛴 실행·concurrency 폐기와 무관하게 일정하다. 따라서 N회 연속 제외될 확률은
          # (1 - window/total)^N로 지수 감소하고, 큐 크기가 그대로면 기대 total/window회
          # 안에 평가된다(total=8이면 2회). 다만 그 몇 회가 실제로 몇 분인지는 트리거가
          # 정하고 cron은 best-effort라 근거로 쓸 수 없다. 실무상 소요를 좌우하는 것은
          # workflow_run(Platform CI 완료)·push·labeled다. 굶주림이 남는 실행 시퀀스가 아예
          # 존재하지 않는다는 점이 결정적 회전과의 차이다.
          #
          # 대안과 실패 모드:
          #  - 지속 커서: 결정적 상한을 주지만 저장소가 필요하다. repository variable은
          #    GITHUB_TOKEN으로 못 쓰고 PAT이 필요하며(이 워크플로는 PAT-free가 방향),
          #    Actions cache는 LRU 축출·미사용 만료가 있어 보장이 다시 소프트해지고,
          #    artifact는 보존 기간과 조회 비용이 붙는다. 상태 추가는 마지막 수단으로 둔다.
          #  - GITHUB_RUN_ID: 간격이 크고 불규칙해 실무상 앨리어싱은 어렵지만, 간격이 total의
          #    배수로 유지되는 시퀀스에서는 여전히 고정된다. "실행 간격과 무관"이 아니다.
          #  - stride를 total과 서로소로 고르기: 유효 보폭에 d가 곱해지므로 d 쪽에서 여전히
          #    고정을 만들 수 있다.
          #  - 창을 버리고 시간 예산만 두기: 시작점이 여전히 큐 앞쪽에 고정되므로 예산이
          #    닿지 않는 뒤쪽 후보의 굶주림이 그대로 남고, API 호출량 상한도 못 받는다.
          #
          # RANDOM은 0..32767이고 total은 --limit 1000으로 상한이 잡히므로 modulo 편향이
          # 남지만, 모든 시작점의 확률이 0보다 크게 유지되므로 위 보장에는 영향이 없다.
          # 후보가 창 안에 다 들어오면(total <= window) 시작점을 0으로 고정해, 회전이
          # 필요 없는 평상시에는 오래된 순 그대로 훑는다. 회전이 걸린 실행에서도 선택된
          # 후보를 원래 순서(오래된 순)로 되돌려 평가하므로, 한 실행 안에서 "평가한 후보
          # 중 가장 오래된 병합 가능 후보가 이긴다"는 성질은 유지된다.
          # candidate-budget-begin
          # budget-constants-begin
          window_max=3
          reserve=200
          fixed_cost=16
          per_candidate=24
          # 두 버킷이 모두 숫자일 때만 값을 낸다. 한쪽이 없거나 비정상인데 남은 하나로
          # 진행하면, 후보 평가가 실제로 소비하는 두 버킷 중 하나의 잔량을 모른 채 쓰는
          # 것이라 "모르는 예산은 쓰지 않는다"가 성립하지 않는다. 어느 쪽이든 비정상이면
          # 빈 출력이 되어 아래 fail-closed 분기로 떨어진다.
          budget_query='
            [.resources.core.remaining, .resources.graphql.remaining] |
            if length == 2 and all(.[]; type == "number") then min else empty end
          '
          # budget-constants-end
          # /rate_limit은 한도를 소비하지 않으므로 매 실행 물어도 공짜다. 조회가 실패하거나
          # 응답이 숫자가 아니면 잔량을 모르는 것이고, 모르는 예산은 쓰지 않는다.
          budget="$(gh api rate_limit --jq "${budget_query}")" || true
          if [[ ! "${budget}" =~ ^[0-9]+$ ]]; then
            echo "::warning::GITHUB_TOKEN 잔량을 읽지 못했다; 이번 실행은 큐를 건너뛴다."
            exit 0
          fi
          window=$(( (budget - reserve - fixed_cost) / per_candidate ))
          if [[ "${window}" -gt "${window_max}" ]]; then
            window="${window_max}"
          fi
          if [[ "${window}" -lt 1 ]]; then
            echo "::warning::GITHUB_TOKEN 잔량 ${budget}회가 예약분 ${reserve}회에 닿았다; 남은 몫을 두고 큐를 건너뛴다."
            exit 0
          fi
          # candidate-budget-end
          # candidate-offset-begin
          total="$(jq 'length' <<<"${candidates}")"
          offset=0
          if [[ "${total}" -gt "${window}" ]]; then
            offset="$(( RANDOM % total ))"
          fi
          # candidate-offset-end
          # paginated-read-begin
          # 페이지를 직접 돌며 상한을 둔다. `gh api --paginate`는 페이지 수에 상한이 없어
          # 이력이 유난히 긴 후보 하나가 위 예산 모델을 통째로 넘길 수 있다. 상한에 닿으면
          # 판정을 포기한다 — 모르는 이력 위에서 병합하지 않는다(fail closed). 상한 3이
          # 후보당 청구 24회의 근거다.
          page_limit=3
          read_pages() {
            local endpoint="$1" page=1 body count pages='[]'
            while [[ "${page}" -le "${page_limit}" ]]; do
              body="$(gh api -H 'Accept: application/vnd.github+json' \
                "${endpoint}?per_page=100&page=${page}")" || return 1
              pages="$(jq -c --argjson page_body "${body}" '. + [$page_body]' <<<"${pages}")"
              # 목록 엔드포인트는 배열, check-runs는 객체를 준다. 두 모양 모두 다룬다.
              count="$(jq 'if type == "array" then length else (.check_runs | length) end' <<<"${body}")"
              if [[ "${count}" -lt 100 ]]; then
                printf '%s' "${pages}"
                return 0
              fi
              page=$((page + 1))
            done
            return 2
          }
          # paginated-read-end
          # authorization-marker-sync-begin
          # exact-head marker는 라벨 이벤트가 게시한다. 코디네이터는 두 경우에만 marker를 맞춘다.
          #  - 재발행: 아래 BEHIND 분기가 P에서 base 갱신을 요청했다는 canonical 기록이 정확히
          #    하나 있고, 기존 canonical marker의 head가 그 P이며, 현재 head가 P를 첫 부모로,
          #    main의 조상을 둘째 부모로 둔 두 부모 병합 커밋일 때 marker를 그 head로 PATCH한다.
          #    그 밖의 head 변화(세션 push, 세션이 만든 병합 커밋)는 재발행하지 않는다. 기록은
          #    재발행 뒤에도 그대로 두고 다음 갱신 요청이 새 P로 PATCH한다. canonical marker가
          #    여러 개면(라벨 재부착 전 누적) 어느 것도 고치지 않는다.
          #  - 복구: canonical marker가 아예 없고(라벨 run이 concurrency 대기 중 취소된 경우)
          #    리뷰 게이트와 같은 정의의 discovery(is_current_pr_commit, 현재 head APPROVED 또는
          #    정규 본문 COMMENTED)가 있으며, 현재 head가 최신 automerge labeled 이벤트 시점에
          #    이미 PR head였을 때만 그 head로 POST한다. 판정은 head 커밋의 committer date <= 최신
          #    automerge labeled 시각이고, 그 시각 이후 head_ref_force_pushed 이벤트가 없는지로
          #    한다. 일반 push는 push 시각을 남기지 않으므로 committer date를 쓴다. committer
          #    date는 작성자가 조작할 수 있어 소유 계정 신뢰를 전제로 한 실수 방지이지 위조 방어가
          #    아니다. 이벤트는 1페이지(가득 차면 overflow 확인 1회)까지만 읽는다.
          # Review와 marker를 건너뛰는 Dependabot Compose 예외 경로는 동기화 대상이 아니다.
          # 조회·형식·변경 실패와 애매한 상태는 marker를 건드리지 않고 아래 리뷰 게이트가 거절하게
          # 둔다. 변경은 github.token(github-actions[bot])으로만 한다. 게이트는 그 봇의 marker만
          # 인정한다. 성공하면 GitHub이 돌려준 comment로 comments(페이지 배열)를 갱신한다(PATCH는
          # 같은 id를 교체, POST는 새 페이지로 추가).
          marker_prefix="<!-- Automerge frozen discovery authorization: "
          base_update_prefix="<!-- Automerge base update requested: "
          # comments에서 github-actions[bot]가 남긴 `<prefix><40hex> -->` comment의 id·head 목록.
          canonical_bot_comment_heads() {
            jq -c --arg prefix "$1" '
              [flatten[] | select(
                type == "object" and
                (.user | type == "object") and
                .user.login == "github-actions[bot]" and
                .user.id == 41898282 and
                .user.type == "Bot" and
                (.body | type == "string") and
                (.body | test("^" + $prefix + "[0-9a-f]{40} -->$"))
              ) | {id, head: (.body | capture(": (?<sha>[0-9a-f]{40}) -->$").sha)}]
            ' <<<"${comments}"
          }
          # 코디네이터가 요청해 수락된 base 갱신을 PR당 canonical 기록 하나로 남긴다.
          record_base_update() {
            local target="$1" requested_head="$2" records="$3" record_body record_count
            record_body="${base_update_prefix}${requested_head} -->"
            record_count="$(jq 'length' <<<"${records}")"
            if [[ "${record_count}" -gt 1 ]] || ! jq -e 'all(.[]; .id | type == "number")' <<<"${records}" >/dev/null; then
              echo "::warning::PR #${target}: base update record is not a single canonical comment; the next head will need a new label authorization."
              return 0
            fi
            if [[ "${record_count}" -eq 1 ]]; then
              if ! gh api --method PATCH "repos/${repo}/issues/comments/$(jq -r '.[0].id' <<<"${records}")" -f body="${record_body}" >/dev/null; then
                echo "::warning::PR #${target}: base update record could not be written; the next head will need a new label authorization."
              fi
            elif ! gh api --method POST "repos/${repo}/issues/${target}/comments" -f body="${record_body}" >/dev/null; then
              echo "::warning::PR #${target}: base update record could not be written; the next head will need a new label authorization."
            fi
          }
          # 입력: pr, head, comments, reviews, commits(read_pages 페이지 배열). 출력: 갱신된 comments.
          sync_authorization_marker() {
            local marker_body markers marker_count marker_id marker_head records head_commit second_parent ancestry
            local response events overflow head_date
            marker_body="${marker_prefix}${head} -->"
            markers="$(canonical_bot_comment_heads "${marker_prefix}")"
            marker_count="$(jq 'length' <<<"${markers}")"
            if [[ "${marker_count}" -eq 1 ]] && [[ "$(jq -r '.[0].head' <<<"${markers}")" == "${head}" ]]; then
              return 0
            fi
            if [[ "${marker_count}" -gt 1 ]] || ! jq -e 'all(.[]; .id | type == "number")' <<<"${markers}" >/dev/null; then
              echo "::warning::PR #${pr}: authorization marker is not a single canonical comment; leaving it unchanged until the label is re-applied."
              return 0
            fi
            if [[ "${marker_count}" -eq 1 ]]; then
              marker_id="$(jq -r '.[0].id' <<<"${markers}")"
              marker_head="$(jq -r '.[0].head' <<<"${markers}")"
              records="$(canonical_bot_comment_heads "${base_update_prefix}")"
              if ! jq -e --arg head "${marker_head}" 'length == 1 and (.[0].id | type == "number") and .[0].head == $head' <<<"${records}" >/dev/null; then
                echo "PR #${pr}: no single coordinator base update record for authorized head ${marker_head}; authorization is not reissued."
                return 0
              fi
              if ! head_commit="$(gh api "repos/${repo}/commits/${head}")" ||
                ! jq -e --arg first "${marker_head}" '
                  (.parents | type == "array") and
                  (.parents | length == 2) and
                  all(.parents[]; (.sha | type == "string") and (.sha | test("^[0-9a-f]{40}$"))) and
                  .parents[0].sha == $first
                ' <<<"${head_commit}" >/dev/null; then
                echo "PR #${pr}: head ${head} is not proven to be a base-update merge on authorized head ${marker_head}; authorization is not reissued."
                return 0
              fi
              second_parent="$(jq -r '.parents[1].sha' <<<"${head_commit}")"
              if ! ancestry="$(gh api "repos/${repo}/compare/${second_parent}...main" --jq '.status')" ||
                [[ "${ancestry}" != ahead && "${ancestry}" != identical ]]; then
                echo "PR #${pr}: merge parent ${second_parent} is not proven to be on main; authorization is not reissued."
                return 0
              fi
              if ! response="$(gh api --method PATCH "repos/${repo}/issues/comments/${marker_id}" -f body="${marker_body}")"; then
                echo "::warning::PR #${pr}: authorization marker could not be reissued for ${head}."
                return 0
              fi
            else
              # 게이트의 신뢰 author와 discovery 절을 그대로 복제한다(commit set 포함).
              if ! jq -s -e --arg head "${head}" '
                .[0] as $reviews |
                .[1] as $commits |
                def is_coderabbit:
                  .author_association == "NONE" and
                  .user.login == "coderabbitai[bot]" and
                  .user.id == 136622811 and
                  .user.type == "Bot";
                def is_current_pr_commit($review):
                  $commits | flatten | any(.sha == ($review.commit_id // ""));
                [($reviews | flatten[]) |
                  select(
                    .author_association == "OWNER" or
                    .author_association == "MEMBER" or
                    .author_association == "COLLABORATOR" or
                    is_coderabbit
                  )] as $trusted |
                any($trusted[];
                  is_current_pr_commit(.) and
                    ((.state == "APPROVED" and .commit_id == $head) or
                    (.state == "COMMENTED" and
                      (is_coderabbit or
                        ((.body // "" | startswith("**Actionable comments posted: ")) and
                        ((.body // "" | contains("<!-- Review source: Aquila fallback; canonical visible structure:")) or
                         (.body // "" | contains("<!-- Review source: Aquila Universal Review; engine: aquila-review -->")) or
                         (.body // "" | contains("<!-- Review source: Codex CLI fallback; canonical visible structure:"))))))))
              ' \
                <(printf '%s\n' "${reviews}") \
                <(printf '%s\n' "${commits}") >/dev/null; then
                echo "PR #${pr}: no authorization marker and no gate-recognized discovery review in the PR commit set; authorization is not recovered."
                return 0
              fi
              if ! events="$(gh api "repos/${repo}/issues/${pr}/events?per_page=100&page=1")" ||
                ! jq -e 'type == "array" and all(.[]; type == "object")' <<<"${events}" >/dev/null; then
                echo "PR #${pr}: label events could not be read; authorization is not recovered."
                return 0
              fi
              if [[ "$(jq 'length' <<<"${events}")" -ge 100 ]] &&
                { ! overflow="$(gh api "repos/${repo}/issues/${pr}/events?per_page=100&page=2")" ||
                  ! jq -e 'type == "array" and length == 0' <<<"${overflow}" >/dev/null; }; then
                echo "PR #${pr}: label events exceed the bounded read; authorization is not recovered."
                return 0
              fi
              head_date="$(jq -r --arg head "${head}" '
                [flatten[] | select(.sha? == $head) | .commit.committer.date] | unique |
                if length == 1 and (.[0] | type == "string") then .[0] else "" end
              ' <<<"${commits}")"
              if ! jq -e --arg head_date "${head_date}" '
                ([.[] | select(.event == "labeled" and .label.name? == "automerge") | .created_at | fromdateiso8601] | max) as $labeled_at |
                ($labeled_at | type == "number") and
                ($head_date | fromdateiso8601) <= $labeled_at and
                all(.[] | select(.event == "head_ref_force_pushed"); (.created_at | fromdateiso8601) < $labeled_at)
              ' <<<"${events}" >/dev/null 2>&1; then
                echo "PR #${pr}: head ${head} is not proven to predate the latest automerge label; authorization is not recovered."
                return 0
              fi
              if ! response="$(gh api --method POST "repos/${repo}/issues/${pr}/comments" -f body="${marker_body}")"; then
                echo "::warning::PR #${pr}: authorization marker could not be recovered for ${head}."
                return 0
              fi
            fi
            if ! jq -e --arg body "${marker_body}" '
              type == "object" and
              (.id | type == "number") and
              (.user | type == "object") and
              .user.login == "github-actions[bot]" and
              .user.id == 41898282 and
              .user.type == "Bot" and
              .body == $body
            ' <<<"${response}" >/dev/null; then
              echo "::warning::PR #${pr}: authorization marker response did not prove the current head; it is not used."
              return 0
            fi
            comments="$(jq -c --argjson response "$(jq -c '{id, body, user}' <<<"${response}")" '
              if any(flatten[]; .id? == $response.id)
              then map(if type == "array" then map(if .id? == $response.id then $response else . end) else . end)
              else . + [[$response]]
              end
            ' <<<"${comments}")"
            echo "PR #${pr}: authorization marker now covers ${head}."
          }
          # authorization-marker-sync-end
          # owner-handoff-begin
          # 소유 세션 handoff: 현재 head를 다시 확인한 뒤 automerge 라벨을 내리고, 같은 head에 한 번만
          # rebase 안내를 남긴다. head가 바뀌거나 읽지 못하면 라벨을 유지하거나 복구한다. 라벨
          # 변경이 수렴하지 않으면 fail closed(exit 1)다. 호출한 쪽은 이어서 이 후보를 건너뛴다.
          owner_handoff() {
            current_head="$(gh pr view "${pr}" --repo "${repo}" --json headRefOid --jq .headRefOid)" || {
              echo "::warning::PR #${pr} current head를 다시 읽지 못해 automerge label을 유지합니다."
              return 0
            }
            if [[ "${current_head}" != "${head}" ]]; then
              echo "::warning::PR #${pr} head가 바뀌어 automerge label을 유지합니다."
              return 0
            fi
            gh pr edit "${pr}" --repo "${repo}" --remove-label automerge || {
              echo "::error::PR #${pr} automerge label을 제거하지 못했습니다."
              exit 1
            }
            post_remove_head="$(gh pr view "${pr}" --repo "${repo}" --json headRefOid --jq .headRefOid)" || {
              echo "::warning::PR #${pr} label 제거 후 current head를 다시 읽지 못해 automerge label을 복구합니다."
              gh pr edit "${pr}" --repo "${repo}" --add-label automerge || {
                echo "::error::PR #${pr} automerge label을 복구하지 못했습니다."
                exit 1
              }
              return 0
            }
            if [[ "${post_remove_head}" != "${head}" ]]; then
              echo "::warning::PR #${pr} label 제거 후 head가 바뀌어 automerge label을 복구합니다."
              gh pr edit "${pr}" --repo "${repo}" --add-label automerge || {
                echo "::error::PR #${pr} automerge label을 복구하지 못했습니다."
                exit 1
              }
              return 0
            fi
            marker="<!-- easysubway-automerge-rebase-required:${head} -->"
            if comments="$(read_pages "repos/${repo}/issues/${pr}/comments")"; then
              if ! jq -e --arg marker "${marker}" \
                'any(flatten[]?; (.body // "") | contains($marker))' <<<"${comments}" >/dev/null; then
                run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                comment="${marker}"$'\n\n'"automerge coordinator가 merge_state=${merge_state}를 확인해 라벨을 제거했습니다. PR 소유 세션이 최신 main에서 rebase하고 current-head Review·CI를 다시 통과한 뒤 automerge 라벨을 추가하세요. Actions run: ${run_url}"
                gh pr comment "${pr}" --repo "${repo}" --body "${comment}" ||
                  echo "::warning::PR #${pr} rebase 안내를 게시하지 못했습니다."
              fi
            else
              echo "::warning::PR #${pr} comment history를 bounded page 안에서 확인하지 못해 안내를 재게시하지 않습니다."
            fi
            echo "::warning::PR #${pr} requires owner rebase (${merge_state}); automerge label removed."
            return 0
          }
          # owner-handoff-end
          while IFS= read -r pr; do
            # budget-recheck-begin
            # per_candidate은 --paginate 추가 페이지까지 덮으라고 잡은 여유값이지 실측이
            # 아니다. 이력이 그 여유를 넘는 후보 하나가 예약분을 침범할 수 있으므로 후보마다
            # 잔량을 다시 읽는다. /rate_limit은 한도를 소비하지 않아 이 재확인은 공짜이고,
            # 여유값은 "한 번의 반복이 예약선을 넘지 않게" 하는 몫만 담당하며 그 이상은
            # 다음 반복의 재측정이 잡는다. 잔량을 못 읽는 것도 예산 소진과 같게 취급한다.
            budget="$(gh api rate_limit --jq "${budget_query}")" || true
            if [[ ! "${budget}" =~ ^[0-9]+$ ]] ||
              [[ "$(( budget - fixed_cost - per_candidate ))" -lt "${reserve}" ]]; then
              echo "::warning::GITHUB_TOKEN 잔량이 예약분 ${reserve}회에 닿았다; 남은 몫을 두고 이번 실행의 후보 평가를 여기서 멈춘다."
              exit 0
            fi
            # budget-recheck-end
            info="$(gh pr view "${pr}" --repo "${repo}" \
              --json baseRefName,headRefName,headRefOid,headRepository,isDraft,labels,mergeStateStatus,state)"
            if ! jq -e '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == "main" and
              any(.labels[]; .name == "automerge")
            ' <<<"${info}" >/dev/null; then
              echo "PR #${pr}: no longer an open labeled pull request against main; skipping."
              continue
            fi

            head="$(jq -r '.headRefOid' <<<"${info}")"
            head_ref="$(jq -r '.headRefName' <<<"${info}")"
            head_repo="$(jq -r '.headRepository.nameWithOwner // ""' <<<"${info}")"
            merge_state="$(jq -r '.mergeStateStatus' <<<"${info}")"

            # merge-state-preflight-begin
            # DIRTY는 소유 세션만 풀 수 있고, PAT 없는 BEHIND도 GITHUB_TOKEN 병합 커밋에 CI가
            # 붙지 않아 coordinator가 대신할 수 없다. 이 둘은 라벨을 내려 무한 재판정 대신 한 번의
            # 명시적 handoff로 끝낸다. PAT가 있는 BEHIND는 여기서 내려보내지 않고 게이트를 모두
            # 통과한 뒤 아래 병합 분기에서 base 갱신 후보가 된다. 단 Dependabot Compose PR의
            # BEHIND는 Review가 없어 게이트를 통과할 수 없으므로, 그 판정이 가능한 첫 지점
            # (dependabot-compose-exception 직후)에서 같은 handoff로 돌려보낸다.
            if [[ "${merge_state}" == "DIRTY" || ( "${merge_state}" == "BEHIND" && "${HAS_AUTOMERGE_PAT}" != true ) ]]; then
              owner_handoff
              continue
            fi
            # merge-state-preflight-end

            rest_pr=''
            rest_pr_available=true
            if ! rest_pr="$(gh api "repos/${repo}/pulls/${pr}")"; then
              rest_pr_available=false
            fi
            files=''
            files_available=true
            if ! files="$(read_pages "repos/${repo}/pulls/${pr}/files")"; then
              files_available=false
            fi
            workflow_runs=''
            workflow_runs_available=true
            if ! workflow_runs="$(gh api "repos/${repo}/actions/runs?head_sha=${head}&per_page=100")"; then
              workflow_runs_available=false
            fi
            commits="$(read_pages "repos/${repo}/pulls/${pr}/commits")" || {
              echo "PR #${pr}: commit history exceeds the page budget; skipping."
              continue
            }
            # dependabot-compose-exception-begin
            # 정확히 구성된 Dependabot의 단일 Compose image locator patch만 Review/marker를
            # 면제한다. API·페이지·patch 어느 하나라도 불완전하면 일반 Review 경로로 내려가
            # fail closed한다. 이 분기는 thread/check/head/merge gate를 건너뛰지 않는다.
            dependabot_compose=false
            dependabot_compose_behind=false
            if [[ ( "${merge_state}" == "CLEAN" || "${merge_state}" == "BEHIND" ) && "${rest_pr_available}" == true && "${files_available}" == true && "${workflow_runs_available}" == true ]] &&
              jq -s -e --arg head "${head}" --arg head_ref "${head_ref}" --arg repo "${repo}" --arg head_repo "${head_repo}" '
              .[0] as $pr |
              .[1] as $files |
              .[2] as $commits |
              .[3] as $runs |
              def dependabot:
                .login == "dependabot[bot]" and .id == 49699333 and .type == "Bot";
              def content_lines($patch):
                $patch | split("\n") |
                map(select((startswith("+") or startswith("-")) and
                           (startswith("+++") | not) and (startswith("---") | not)));
              ($pr.user | dependabot) and
              ($pr.head | type == "object" and
                .sha == $head and .ref == $head_ref and
                (.repo | type == "object" and .full_name == $head_repo)) and
              ($runs | type == "object" and
                ($runs.total_count | type == "number" and floor == . and . >= 0 and . < 100) and
                ($runs.workflow_runs | type == "array") and
                $runs.total_count == ($runs.workflow_runs | length) and
                any($runs.workflow_runs[];
                  type == "object" and
                  .workflow_id == 324173434 and
                  .head_sha == $head and .head_branch == $head_ref and
                  .event == "pull_request" and
                  (.repository | type == "object" and .full_name == $repo) and
                  (.head_repository | type == "object" and .full_name == $head_repo) and
                  (.actor | dependabot) and (.triggering_actor | dependabot)
                )) and
              ($files | flatten) as $changed |
              ($changed | length == 1 and .[0].filename == "infra/docker-compose.yml" and
                (.[0]) as $file |
                ($file.patch? | type == "string") and
                ($file.patch | contains("\n...") | not) and
                ($file.patch | contains("EASYSUBWAY_BACKEND_IMAGE") | not) and
                (($file.additions | type == "number" and floor == . and . >= 0) and
                 ($file.deletions | type == "number" and floor == . and . >= 0) and
                 ($file.changes | type == "number" and floor == . and . >= 0) and
                 $file.changes == ($file.additions + $file.deletions)) and
                (content_lines($file.patch)) as $lines |
                (($lines | map(select(startswith("+"))) | length) == $file.additions) and
                (($lines | map(select(startswith("-"))) | length) == $file.deletions) and
                ($lines | length > 0 and all(.[];
                  (test("^[+-][[:space:]]*image:[[:space:]]*[A-Za-z0-9][A-Za-z0-9._-]*(?::[0-9]+)?(?:/[A-Za-z0-9][A-Za-z0-9._-]*)*(?::[A-Za-z0-9][A-Za-z0-9._.-]*@sha256:[a-f0-9]{64}|@sha256:[a-f0-9]{64})[[:space:]]*$")) and
                  ((test("(^|:)latest([[:space:]]|$|@)")) | not) and
                  ((contains("EASYSUBWAY_BACKEND_IMAGE")) | not)))) and
              ($commits | flatten) as $commit_set |
              ($commit_set | length == 1 and .[0].sha == $head and (.[0].author | dependabot))
            ' <(printf '%s\n' "${rest_pr}") <(printf '%s\n' "${files}") <(printf '%s\n' "${commits}") <(printf '%s\n' "${workflow_runs}") >/dev/null; then
              # 예외(Review·marker 면제)는 지금처럼 CLEAN에만 적용한다. 같은 모양의 BEHIND는
              # 면제하지 않고 아래에서 소유 세션에 handoff한다.
              if [[ "${merge_state}" == "CLEAN" ]]; then
                dependabot_compose=true
              else
                dependabot_compose_behind=true
              fi
            fi
            # dependabot-compose-exception-end
            if [[ "${dependabot_compose_behind}" == true ]]; then
              owner_handoff
              continue
            fi

            if [[ "${dependabot_compose}" != true ]]; then
              reviews="$(read_pages "repos/${repo}/pulls/${pr}/reviews")" || {
                echo "PR #${pr}: review history exceeds the page budget; skipping."
                continue
              }
              comments="$(read_pages "repos/${repo}/issues/${pr}/comments")" || {
                echo "PR #${pr}: comment history exceeds the page budget; skipping."
                continue
              }
              sync_authorization_marker
              base_update_records="$(canonical_bot_comment_heads "${base_update_prefix}")"
            # review-state-filter-begin
            # frozen discovery는 라벨 이벤트에서 GitHub Actions가 기록한 exact-head marker가
            # 있을 때만 승계한다. 임의 author·다른 SHA·후속 push는 게이트를 통과하지 못한다.
            if ! jq -s -e --arg head "${head}" '
              .[0] as $reviews |
              .[1] as $comments |
              .[2] as $commits |
              def is_coderabbit:
                .author_association == "NONE" and
                .user.login == "coderabbitai[bot]" and
                .user.id == 136622811 and
                .user.type == "Bot";
              def is_exact_head_marker:
                .user.login == "github-actions[bot]" and
                .user.id == 41898282 and
                .user.type == "Bot" and
                (.body // "") == ("<!-- Automerge frozen discovery authorization: " + $head + " -->");
              def is_current_pr_commit($review):
                $commits | flatten | any(.sha == ($review.commit_id // ""));
              [($reviews | flatten[]) |
                select(
                  .author_association == "OWNER" or
                  .author_association == "MEMBER" or
                  .author_association == "COLLABORATOR" or
                  is_coderabbit
                )] as $trusted |
              ($trusted |
              sort_by(.submitted_at, .id) |
              reduce .[] as $review ({};
                if $review.state == "COMMENTED" then
                  .[$review.user.login] //= "COMMENTED"
                elif $review.state == "DISMISSED" then
                  del(.[$review.user.login])
                else
                  .[$review.user.login] = $review.state
                end
              )) as $states |
              ($comments | flatten | any(is_exact_head_marker)) and
              ($states | length > 0 and all(.[]; . == "APPROVED" or . == "COMMENTED")) and
              any($trusted[];
                is_current_pr_commit(.) and
                  ((.state == "APPROVED" and .commit_id == $head) or
                  (.state == "COMMENTED" and
                    (is_coderabbit or
                      ((.body // "" | startswith("**Actionable comments posted: ")) and
                      ((.body // "" | contains("<!-- Review source: Aquila fallback; canonical visible structure:")) or
                       (.body // "" | contains("<!-- Review source: Aquila Universal Review; engine: aquila-review -->")) or
                       (.body // "" | contains("<!-- Review source: Codex CLI fallback; canonical visible structure:"))))))))
            ' \
              <(printf '%s\n' "${reviews}") \
              <(printf '%s\n' "${comments}") \
              <(printf '%s\n' "${commits}") >/dev/null; then
              echo "PR #${pr}: no trusted frozen discovery review, or an active change request is open; skipping."
              continue
            fi
            # review-state-filter-end
            fi

            # shellcheck disable=SC2016
            threads="$(gh api graphql -f owner="${owner}" -f name="${name}" -F number="${pr}" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes { isResolved }
                      pageInfo { hasNextPage }
                    }
                  }
                }
              }
            ')"
            if ! jq -e '
              .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false and
              all(.data.repository.pullRequest.reviewThreads.nodes[]; .isResolved)
            ' <<<"${threads}" >/dev/null; then
              echo "PR #${pr}: unresolved review threads remain; skipping."
              continue
            fi

            checks="$(read_pages "repos/${repo}/commits/${head}/check-runs")" || {
              echo "PR #${pr}: check-run history exceeds the page budget; skipping."
              continue
            }
            statuses="$(read_pages "repos/${repo}/commits/${head}/statuses")" || {
              echo "PR #${pr}: commit status history exceeds the page budget; skipping."
              continue
            }
            # required-context-loop-begin
            contexts_ok=true
            contexts_missing=false
            while IFS= read -r required_check; do
              # 아직 끝나지 않은 check는 계약 위반이 아니다. 진행 중(conclusion null)이나
              # 새 head에 아직 안 붙은 상태를 실패로 처리하면 그 신호가 그대로 오해를 만든다.
              # 명시적 실패만 위반이고, 위반이든 대기든 이 후보만 건너뛴다.
              # required-context-filter-begin
              context_state="$(jq -r --argjson required_check "${required_check}" --argjson statuses "${statuses}" '
                ($statuses | flatten) as $status_records |
                ([.[].check_runs[] |
                  select(.name == $required_check.context) |
                  select($required_check.integration_id == null or .app.id == $required_check.integration_id)] |
                  sort_by(.started_at, .id) |
                  last) as $run |
                ([$status_records[] | select(.context == $required_check.context)] |
                  sort_by((.updated_at // .created_at // ""), .id) |
                  last) as $status |
                (if $run == null then null
                 elif $run.conclusion == null then "pending"
                 elif $run.conclusion == "success" then "success"
                 else "failure" end) as $run_state |
                (if $required_check.integration_id != null or $status == null then null
                 elif $status.state == "success" then "success"
                 elif $status.state == "pending" then "pending"
                 else "failure" end) as $status_state |
                # 같은 이름의 check run과 classic status가 함께 있으면 둘 다 봐야 한다.
                # 하나만 보면 나머지 하나가 실패·대기여도 병합이 진행된다. 결합 규칙은
                # "실패가 하나라도 있으면 실패, 전부 성공이어야 성공, 나머지는 대기"다.
                [$run_state, $status_state] | map(select(. != null)) as $observed |
                if ($observed | length) == 0 then "missing"
                elif ($observed | any(. == "failure")) then "failure"
                elif ($observed | all(. == "success")) then "success"
                else "pending"
                end
              ' <<<"${checks}")"
              # required-context-filter-end
              context_name="$(jq -r '.context' <<<"${required_check}")"
              case "${context_state}" in
                success) ;;
                pending)
                  contexts_ok=false
                  echo "PR #${pr}: required context pending: ${context_name}; skipping."
                  break
                  ;;
                missing)
                  contexts_ok=false
                  contexts_missing=true
                  echo "PR #${pr}: required context missing: ${context_name}."
                  break
                  ;;
                *)
                  # 실패는 사람이 봐야 하는 상태다. 실행을 실패시키면 큐 전체가 멈추므로
                  # annotation으로만 드러내고 이 후보는 건너뛴다.
                  echo "::warning::PR #${pr} has a failing required context (${context_name}); skipping until it is green."
                  contexts_ok=false
                  break
                  ;;
              esac
            done < <(jq -c '.[]' <<<"${required}")
            if [[ "${contexts_ok}" != true ]]; then
              # 부재는 대기와 다르다. same-repository head에 required context가 한 번도
              # 붙지 않았다면 이 경로가 CI를 명시 dispatch한다. BEHIND·DIRTY는 위 preflight가
              # 먼저 라벨을 제거하므로 여기에는 branch 갱신 가능한 상태만 도달한다.
              # fork head에는 base 저장소 CI를 쏘지 않는다. 쏜 CI가 pending check를 만들어
              # 다음 실행은 위 pending 분기로 떨어지므로 head당 한 번만 쏘게 된다.
              # 이 dispatch는 병합과 달리 실행을 끝내지 않는다. 병합 직렬화와
              # 무관하고, 여기서 실행을 끝내면 뒤의 병합 가능한 후보가 다시 굶는다.
              # missing-context-dispatch-begin
              if [[ "${contexts_missing}" == true && "${head_repo}" == "${repo}" ]]; then
                if gh workflow run ci.yml --repo "${repo}" --ref "${head_ref}"; then
                  echo "PR #${pr}: required context missing; CI dispatched."
                else
                  # 호출 실패는 다음 트리거가 다시 판정한다. 큐를 세우지 않는다.
                  echo "::warning::PR #${pr} CI dispatch failed for a missing required context; retrying on the next trigger."
                fi
              fi
              continue
              # missing-context-dispatch-end
            fi
            # required-context-loop-end

            # required context 검증이 병합 가능 여부의 정본이다. mergeStateStatus는 여기서
            # preflight 이후의 병합 가능 상태 변화를 가려내는 데만 쓴다.
            # merge-state-dispatch-begin
            fail_closed_pr() {
              local operation="$1"
              local failed_status="$2"
              local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              local comment="automerge coordinator의 ${operation}이 실패했습니다. 당시 merge_state=${merge_state}, exit status=${failed_status}, Actions run: ${run_url}. automerge label을 제거합니다. 원인을 해결하고 모든 gate 통과 후 다시 추가하세요."

              gh pr comment "${pr}" --repo "${repo}" --body "${comment}" ||
                echo "::warning::PR #${pr} failure comment could not be posted."
              gh pr edit "${pr}" --repo "${repo}" --remove-label automerge || {
                echo "::error::PR #${pr} automerge label could not be removed."
                return 1
              }
            }
            case "${merge_state}" in
              CLEAN | HAS_HOOKS | UNSTABLE)
                # UNSTABLE은 "mergeable하지만 필수가 아닌 check가 green이 아님"이다.
                # ruleset이 필수로 두지 않은 check로 병합을 막지 않는다.
                #
                # 이 저장소는 allow_auto_merge가 꺼져 있어(실측) `--auto`가 API 오류로
                # 실패한다. 형제 저장소와 달리 즉시 병합을 호출하는데, 이 분기는 리뷰 객체·
                # 미해결 thread·required context를 모두 통과한 뒤에만 닿으므로 `--auto`가
                # 대신 기다려 줄 대상이 남아 있지 않다. --match-head-commit이 판정 시점
                # 이후의 head 변경을 서버에서 거른다.
                if GH_TOKEN="${MERGE_GH_TOKEN}" gh pr merge --squash "${pr}" --repo "${repo}" \
                  --match-head-commit "${head}"; then
                  echo "PR #${pr}: merged (${merge_state})."
                  exit 0
                else
                  failed_status=$?
                  fail_closed_pr "병합 호출" "${failed_status}" || exit "${failed_status}"
                  exit "${failed_status}"
                fi
                ;;
              BEHIND)
                # preflight가 PAT 없는 BEHIND를 이미 handoff했으므로 여기에는 PAT가 있을 때만
                # 닿는다. 게이트를 통과한 현재 head를 고정해 base만 갱신하고, 수락된 요청을
                # 기록한 뒤 실행을 끝낸다. 새 head의 CI 완료가 다음 실행을 부르고, 그 실행이
                # 기록으로 marker를 재발행한 뒤 같은 게이트를 다시 통과해야 병합한다.
                if [[ "${HAS_AUTOMERGE_PAT}" != true ]]; then
                  echo "::warning::PR #${pr} is behind main without AUTOMERGE_PAT; its owning session must rebase and push."
                  continue
                fi
                if GH_TOKEN="${MERGE_GH_TOKEN}" gh api --method PUT "repos/${repo}/pulls/${pr}/update-branch" \
                  -f expected_head_sha="${head}" >/dev/null; then
                  record_base_update "${pr}" "${head}" "${base_update_records}"
                  echo "PR #${pr}: behind main; requested a base merge on gated head ${head}. The next run re-evaluates the new head."
                  exit 0
                else
                  update_status=$?
                  echo "::warning::PR #${pr} is behind main and its base merge request failed (status ${update_status}); skipping without merging."
                  continue
                fi
                ;;
              BLOCKED | UNKNOWN)
                # UNKNOWN은 GitHub이 mergeability를 계산 중인 상태다. BLOCKED은 이 job이
                # 검사하지 않는 네이티브 규칙(추가 승인 수·code owner 리뷰·필수 배포 승인)이
                # 남아 있다는 뜻일 수 있다. 어느 쪽이든 이번 실행에서 할 수 있는 일이 없고,
                # 이 후보가 뒤를 막지도 않는다.
                echo "PR #${pr}: not mergeable yet (${merge_state}); skipping."
                continue
                ;;
              *)
                # DRAFT는 위 검증에서 이미 걸러진다. 그 밖의 값은 GitHub이 enum을 늘렸다는
                # 뜻이라 사람이 봐야 하지만, 실행을 실패시키면 큐 전체가 멈추므로 경고만 남긴다.
                echo "::warning::PR #${pr} has an unrecognized merge state (${merge_state}); skipping."
                continue
                ;;
            esac
            # merge-state-dispatch-end
          # candidate-window-begin
          done < <(jq -r --argjson window "${window}" --argjson offset "${offset}" '
            . as $all |
            length as $total |
            if $total == 0 then empty
            else [range($offset; $offset + $window) | . % $total] | unique | map($all[.])[]
            end
          ' <<<"${candidates}")
          # candidate-window-end

          echo "No pull request in the automerge queue is ready to merge."
          # queue-loop-end
