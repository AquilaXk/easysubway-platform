name: Public Sensitivity Owner Receipt Caller

on:
  workflow_dispatch:
    inputs:
      observed_at:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  receipt:
    uses: AquilaXk/easysubway/.github/workflows/public-sensitivity-owner-receipt.yml@851092086f641a3e61401c01bd296a77666a3787
    with:
      observed_at: ${{ inputs.observed_at }}
    secrets:
      D20_SECRET_SCANNING_ALERTS_READ_TOKEN: ${{ secrets.D20_SECRET_SCANNING_ALERTS_READ_TOKEN }}
