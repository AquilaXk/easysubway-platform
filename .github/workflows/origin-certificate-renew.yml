name: Origin Certificate Renew

# AquilaXk/easysubway-platform#270: 운영 호스트 nginx의 Let's Encrypt 인증서가 2026-10-26에 만료돼
# Cloudflare가 526을 냈다.
# check job은 nginx가 내보내는 인증서와 디스크 인증서의 만료, 갱신 타이머·hook 상태를 읽어 판정 줄을 출력한다.
# renew job은 RENEW일 때만 돌며, 갱신하고 nginx 설정을 검사해 다시 읽은 뒤 내보내는 인증서가
# 30일 넘게 남고 nginx가 서비스하는 두 호스트와 맞는지, 공개 readiness가 200인지 확인한다.
# 이 레포는 공개라 로그를 누구나 읽는다. 원 서버 주소가 찍힐 수 있는 certbot 로그와 ACME 출력은 남기지 않는다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "CHECK reads expiry and timer state only. RENEW renews the certificate and reloads nginx."
        type: choice
        options:
          - CHECK
          - RENEW
        default: CHECK

permissions: {}

env:
  CERT_NAME: easysubway-api.aquilaxk.site
  # nginx가 443에서 같은 인증서로 서비스하는 이름(infra/nginx/host-easysubway.conf.template의 server_name).
  SERVED_HOSTS: easysubway-api.aquilaxk.site easysubway.aquilaxk.site
  # 호스트 nginx가 공개로 여는 actuator 경로는 readiness와 liveness뿐이다.
  PUBLIC_HEALTH_URL: https://easysubway-api.aquilaxk.site/actuator/health/readiness

jobs:
  check:
    name: Origin certificate state
    # 허용되지 않은 행위자의 dispatch는 환경·러너를 잡기 전에 job 단계에서 건너뛴다(platform#244 게이트 계약).
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.triggering_actor == 'AquilaXk'
    concurrency:
      group: origin-certificate-production
      cancel-in-progress: false
    # 영수증 검증기가 Actions run 기록으로 실행자를 확인한다.
    permissions:
      contents: read
      actions: read
    environment: production-deploy
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - easysubway-production
    timeout-minutes: 5
    steps:
      - name: Require an authorized dispatcher
        shell: bash
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "${TRIGGERING_ACTOR}" in
            "AquilaXk") ;;
            *) echo "deploy dispatcher is not authorized: ${TRIGGERING_ACTOR}" >&2; exit 1 ;;
          esac
          [[ "${DEPLOY_REF}" == "refs/heads/main" && "${RUN_ATTEMPT}" == "1" ]] || { echo "deploy must start from main on the first attempt" >&2; exit 1; }

      - name: Checkout Platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Verify production-deploy admission
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/platform/verify-production-deploy-effective-admission-receipt.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --workflow-sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/admission-receipt.json"

      - name: Origin certificate / Read expiry and renewal timer
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          echo "== served by nginx on 127.0.0.1:443"
          if served="$(echo | timeout 5 openssl s_client -connect 127.0.0.1:443 -servername "${CERT_NAME}" 2>/dev/null | openssl x509 2>/dev/null)"; then
            echo "${served}" | openssl x509 -noout -enddate
            if ! echo "${served}" | openssl x509 -noout -checkend 0 >/dev/null; then echo "verdict: EXPIRED (RENEW needed)"
            elif ! echo "${served}" | openssl x509 -noout -checkend $(( 30 * 86400 )) >/dev/null; then echo "verdict: expires within 30 days"
            else echo "verdict: valid for more than 30 days"
            fi
          else
            echo "no certificate read from 127.0.0.1:443"; failed=1
          fi
          echo "== on-disk lineage"
          rc=0
          lineage="$(sudo --non-interactive certbot certificates --cert-name "${CERT_NAME}" 2>&1)" || rc=$?
          if [[ "${rc}" == 0 ]]; then
            echo "${lineage}" | grep -E 'Certificate Name|Domains|Expiry Date' || echo "lineage listing has no expiry line"
          else
            echo "lineage could not be read (exit ${rc}): $(echo "${lineage}" | head -n 1)"; failed=1
          fi
          echo "== renewal timer"
          # 둘 중 하나가 enabled이고 active여야 자동 갱신이 돈다. 둘 다 아니면 이번 사고의 원인 후보라 실패로 센다.
          timer_ok=0
          for unit in certbot.timer snap.certbot.renew.timer; do
            enabled="$(systemctl is-enabled "${unit}" 2>/dev/null)" || true
            active="$(systemctl is-active "${unit}" 2>/dev/null)" || true
            echo "${unit}: enabled=${enabled:-not-found} active=${active:-not-found}"
            [[ "${enabled}" == "enabled" && "${active}" == "active" ]] && timer_ok=1
          done
          [[ "${timer_ok}" == 1 ]] || { echo "neither certbot.timer nor snap.certbot.renew.timer is enabled and active"; failed=1; }
          echo "== renewal hooks"
          for dir in pre deploy post; do
            path="/etc/letsencrypt/renewal-hooks/${dir}"
            if [[ ! -e "${path}" ]]; then echo "${dir}: absent"
            elif [[ ! -r "${path}" || ! -x "${path}" ]]; then echo "${dir}: unreadable"
            elif listing="$(find "${path}" -mindepth 1 -maxdepth 1 -printf '%f ')"; then echo "${dir}: ${listing}"
            else echo "${dir}: listing failed"; failed=1
            fi
          done
          exit "${failed}"

  renew:
    name: Origin certificate renew
    # check가 건너뛰어지거나 실패하면 이 job도 돌지 않는다. 실행자 게이트는 이 job에도 그대로 둔다.
    needs: check
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.triggering_actor == 'AquilaXk' && inputs.mode == 'RENEW'
    concurrency:
      group: origin-certificate-production
      cancel-in-progress: false
    # 영수증 검증기가 Actions run 기록으로 실행자를 확인한다.
    permissions:
      contents: read
      actions: read
    environment: production-deploy
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - easysubway-production
    # 검증만 최대 약 270초(호스트 2개 × 10회 × 7초, readiness 10회 × 13초)라 갱신과 영수증 확인까지 넉넉히 둔다.
    timeout-minutes: 12
    steps:
      - name: Require an authorized dispatcher
        shell: bash
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "${TRIGGERING_ACTOR}" in
            "AquilaXk") ;;
            *) echo "deploy dispatcher is not authorized: ${TRIGGERING_ACTOR}" >&2; exit 1 ;;
          esac
          [[ "${DEPLOY_REF}" == "refs/heads/main" && "${RUN_ATTEMPT}" == "1" ]] || { echo "deploy must start from main on the first attempt" >&2; exit 1; }

      - name: Checkout Platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Verify production-deploy admission
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/platform/verify-production-deploy-effective-admission-receipt.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --workflow-sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/admission-receipt.json"

      - name: Origin certificate / Renew and reload nginx
        shell: bash
        run: |
          set -euo pipefail
          # certbot 출력에는 ACME 검증 주소가 찍힐 수 있어 공개 로그에 남기지 않고 종료 코드만 쓴다.
          rc=0
          sudo --non-interactive certbot renew --cert-name "${CERT_NAME}" --no-random-sleep-on-renew --quiet >/dev/null 2>&1 || rc=$?
          if [[ "${rc}" != 0 ]]; then
            echo "certbot renew failed (exit ${rc}); read /var/log/letsencrypt/letsencrypt.log on the host" >&2
            exit 1
          fi
          sudo --non-interactive nginx -t
          sudo --non-interactive nginx -s reload

      - name: Origin certificate / Verify served certificate and public readiness
        shell: bash
        run: |
          set -euo pipefail
          for host in ${SERVED_HOSTS}; do
            served=""
            last_seen="no certificate served"
            for _ in $(seq 1 10); do
              candidate="$(echo | timeout 5 openssl s_client -connect 127.0.0.1:443 -servername "${host}" 2>/dev/null | openssl x509 2>/dev/null || true)"
              if [[ -n "${candidate}" ]]; then
                last_seen="$(echo "${candidate}" | openssl x509 -noout -enddate)"
                if echo "${candidate}" | openssl x509 -noout -checkend $(( 30 * 86400 )) >/dev/null \
                  && echo "${candidate}" | openssl x509 -noout -checkhost "${host}" | grep -q 'does match'; then
                  served="${candidate}"
                  break
                fi
              fi
              sleep 2
            done
            if [[ -z "${served}" ]]; then
              echo "${host}: origin does not serve a matching certificate valid for more than 30 days; last seen: ${last_seen}" >&2
              exit 1
            fi
            echo "${host}: $(echo "${served}" | openssl x509 -noout -enddate)"
          done
          status=""
          for _ in $(seq 1 10); do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PUBLIC_HEALTH_URL}" || true)"
            [[ "${status}" == "200" ]] && break
            sleep 3
          done
          echo "public readiness: ${status}"
          [[ "${status}" == "200" ]] || { echo "public readiness did not return 200 after renewal" >&2; exit 1; }
