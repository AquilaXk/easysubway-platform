name: Source-free Journey Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Closed execution mode"
        required: true
        type: choice
        options:
          - PREVIEW
          - DEPLOY
      backend_run_id:
        description: "Exact Backend release workflow run ID"
        required: true
        type: string
      backend_artifact_id:
        description: "Exact Backend release artifact ID"
        required: true
        type: string
      backend_artifact_name:
        description: "Exact Backend release artifact name"
        required: true
        type: string
      backend_archive_sha256:
        description: "Exact Backend archive SHA-256"
        required: true
        type: string
      data_run_id:
        description: "Exact Data FINAL workflow run ID"
        required: true
        type: string
      data_artifact_id:
        description: "Exact Data FINAL artifact ID"
        required: true
        type: string
      data_artifact_name:
        description: "Exact Data FINAL artifact name"
        required: true
        type: string
      data_archive_sha256:
        description: "Exact Data archive SHA-256"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preview:
    name: Validate source-free package
    if: github.ref == 'refs/heads/main' && inputs.mode == 'PREVIEW' && github.run_attempt == 1
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Download exact Backend archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.backend_artifact_id }}
          run-id: ${{ inputs.backend_run_id }}
          repository: AquilaXk/easysubway-backend
          github-token: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          path: ${{ runner.temp }}/backend-archive
          skip-decompress: true

      - name: Download exact Data archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.data_artifact_id }}
          run-id: ${{ inputs.data_run_id }}
          repository: AquilaXk/easysubway-data
          github-token: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          path: ${{ runner.temp }}/data-archive
          skip-decompress: true

      - name: Validate archives and immutable deployment inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EASYSUBWAY_ENV: ${{ secrets.EASYSUBWAY_ENV }}
          BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
          BACKEND_ARTIFACT_ID: ${{ inputs.backend_artifact_id }}
          BACKEND_ARTIFACT_NAME: ${{ inputs.backend_artifact_name }}
          BACKEND_ARCHIVE_SHA256: ${{ inputs.backend_archive_sha256 }}
          DATA_RUN_ID: ${{ inputs.data_run_id }}
          DATA_ARTIFACT_ID: ${{ inputs.data_artifact_id }}
          DATA_ARTIFACT_NAME: ${{ inputs.data_artifact_name }}
          DATA_ARCHIVE_SHA256: ${{ inputs.data_archive_sha256 }}
        run: |
          set -euo pipefail
          backend_metadata="$(gh api "repos/AquilaXk/easysubway-backend/actions/artifacts/${BACKEND_ARTIFACT_ID}" --jq '[.name, (.workflow_run.id|tostring), (.expired|tostring)] | @tsv')"
          data_metadata="$(gh api "repos/AquilaXk/easysubway-data/actions/artifacts/${DATA_ARTIFACT_ID}" --jq '[.name, (.workflow_run.id|tostring), (.expired|tostring)] | @tsv')"
          [[ "${backend_metadata}" == "${BACKEND_ARTIFACT_NAME}"$'\t'"${BACKEND_RUN_ID}"$'\tfalse' ]]
          [[ "${data_metadata}" == "${DATA_ARTIFACT_NAME}"$'\t'"${DATA_RUN_ID}"$'\tfalse' ]]
          mapfile -t backend_archives < <(find "${RUNNER_TEMP}/backend-archive" -maxdepth 1 -type f -print)
          mapfile -t data_archives < <(find "${RUNNER_TEMP}/data-archive" -maxdepth 1 -type f -print)
          [[ "${#backend_archives[@]}" -eq 1 && "${#data_archives[@]}" -eq 1 ]]
          [[ "$(sha256sum "${backend_archives[0]}" | cut -d ' ' -f 1)" == "${BACKEND_ARCHIVE_SHA256}" ]]
          [[ "$(sha256sum "${data_archives[0]}" | cut -d ' ' -f 1)" == "${DATA_ARCHIVE_SHA256}" ]]
          preview_root="${RUNNER_TEMP}/source-free-preview"
          mkdir -p "${RUNNER_TEMP}/backend" "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/prepared" \
            "${preview_root}/source-free-inputs" "${preview_root}/release-receipts"
          unzip -q "${backend_archives[0]}" -d "${RUNNER_TEMP}/backend"
          unzip -q "${data_archives[0]}" -d "${RUNNER_TEMP}/data"
          printf '%s' "${EASYSUBWAY_ENV}" > "${RUNNER_TEMP}/deployment.env"
          chmod 600 "${RUNNER_TEMP}/deployment.env"
          tools/deploy/prepare-deployment-env.sh "${RUNNER_TEMP}/deployment.env" tools/deploy/compose-server-env.allowlist tools/deploy/backend-app-env.allowlist "${RUNNER_TEMP}/prepared"
          node tools/platform/verify-production-deploy-effective-admission-receipt.mjs --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" --workflow-sha "${GITHUB_SHA}" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/admission-receipt.json"
          node tools/platform/prepare-source-free-fixed-host-deployment.mjs \
            --mode PREVIEW \
            --backend-artifact-root "${RUNNER_TEMP}/backend" \
            --data-artifact-root "${RUNNER_TEMP}/data" \
            --admission-receipt "${RUNNER_TEMP}/admission-receipt.json" \
            --compose-env "${RUNNER_TEMP}/prepared/compose.env" \
            --backend-env "${RUNNER_TEMP}/prepared/backend.env" \
            --deploy-root "${preview_root}" \
            --output-root "${preview_root}/source-free-inputs/source-free-${GITHUB_RUN_ID}" \
            --operation-directory "${preview_root}/release-receipts/source-free-${GITHUB_RUN_ID}" \
            --request-output "${RUNNER_TEMP}/fixed-host-request.json" \
            --platform-revision "${GITHUB_SHA}" \
            --traffic-generation "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --project-name "${{ vars.DEPLOY_COMPOSE_PROJECT }}" \
            > "${RUNNER_TEMP}/preview.json"
          cat "${RUNNER_TEMP}/preview.json" >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Execute source-free single-host cutover
    if: github.ref == 'refs/heads/main' && inputs.mode == 'DEPLOY' && github.run_attempt == 1
    environment: production-deploy
    runs-on: [self-hosted, Linux, ARM64, easysubway-production]
    timeout-minutes: 20
    steps:
      - name: Checkout Platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Download exact Backend archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.backend_artifact_id }}
          run-id: ${{ inputs.backend_run_id }}
          repository: AquilaXk/easysubway-backend
          github-token: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          path: ${{ runner.temp }}/backend-archive
          skip-decompress: true

      - name: Download exact Data archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.data_artifact_id }}
          run-id: ${{ inputs.data_run_id }}
          repository: AquilaXk/easysubway-data
          github-token: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          path: ${{ runner.temp }}/data-archive
          skip-decompress: true

      - name: Validate archives and cut over one host
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EASYSUBWAY_ENV: ${{ secrets.EASYSUBWAY_ENV }}
          EASYSUBWAY_JOURNEY_CURRENT_PUBLIC_KEY_PEM: ${{ secrets.EASYSUBWAY_JOURNEY_CURRENT_PUBLIC_KEY_PEM }}
          EASYSUBWAY_JOURNEY_READINESS_SERVICE_TOKEN: ${{ secrets.EASYSUBWAY_JOURNEY_READINESS_SERVICE_TOKEN }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
          BACKEND_ARTIFACT_ID: ${{ inputs.backend_artifact_id }}
          BACKEND_ARTIFACT_NAME: ${{ inputs.backend_artifact_name }}
          BACKEND_ARCHIVE_SHA256: ${{ inputs.backend_archive_sha256 }}
          DATA_RUN_ID: ${{ inputs.data_run_id }}
          DATA_ARTIFACT_ID: ${{ inputs.data_artifact_id }}
          DATA_ARTIFACT_NAME: ${{ inputs.data_artifact_name }}
          DATA_ARCHIVE_SHA256: ${{ inputs.data_archive_sha256 }}
        run: |
          set -euo pipefail
          backend_metadata="$(gh api "repos/AquilaXk/easysubway-backend/actions/artifacts/${BACKEND_ARTIFACT_ID}" --jq '[.name, (.workflow_run.id|tostring), (.expired|tostring)] | @tsv')"
          data_metadata="$(gh api "repos/AquilaXk/easysubway-data/actions/artifacts/${DATA_ARTIFACT_ID}" --jq '[.name, (.workflow_run.id|tostring), (.expired|tostring)] | @tsv')"
          [[ "${backend_metadata}" == "${BACKEND_ARTIFACT_NAME}"$'\t'"${BACKEND_RUN_ID}"$'\tfalse' ]]
          [[ "${data_metadata}" == "${DATA_ARTIFACT_NAME}"$'\t'"${DATA_RUN_ID}"$'\tfalse' ]]
          mapfile -t backend_archives < <(find "${RUNNER_TEMP}/backend-archive" -maxdepth 1 -type f -print)
          mapfile -t data_archives < <(find "${RUNNER_TEMP}/data-archive" -maxdepth 1 -type f -print)
          [[ "${#backend_archives[@]}" -eq 1 && "${#data_archives[@]}" -eq 1 ]]
          [[ "$(sha256sum "${backend_archives[0]}" | cut -d ' ' -f 1)" == "${BACKEND_ARCHIVE_SHA256}" ]]
          [[ "$(sha256sum "${data_archives[0]}" | cut -d ' ' -f 1)" == "${DATA_ARCHIVE_SHA256}" ]]
          mkdir -p "${RUNNER_TEMP}/backend" "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/prepared" \
            "${DEPLOY_ROOT}/source-free-inputs" "${DEPLOY_ROOT}/release-receipts"
          chmod 700 "${DEPLOY_ROOT}/source-free-inputs" "${DEPLOY_ROOT}/release-receipts"
          unzip -q "${backend_archives[0]}" -d "${RUNNER_TEMP}/backend"
          unzip -q "${data_archives[0]}" -d "${RUNNER_TEMP}/data"
          printf '%s' "${EASYSUBWAY_ENV}" > "${RUNNER_TEMP}/deployment.env"
          chmod 600 "${RUNNER_TEMP}/deployment.env"
          tools/deploy/prepare-deployment-env.sh "${RUNNER_TEMP}/deployment.env" tools/deploy/compose-server-env.allowlist tools/deploy/backend-app-env.allowlist "${RUNNER_TEMP}/prepared"
          node tools/platform/verify-production-deploy-effective-admission-receipt.mjs --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" --workflow-sha "${GITHUB_SHA}" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${RUNNER_TEMP}/admission-receipt.json"
          node tools/platform/prepare-source-free-fixed-host-deployment.mjs \
            --mode DEPLOY \
            --backend-artifact-root "${RUNNER_TEMP}/backend" \
            --data-artifact-root "${RUNNER_TEMP}/data" \
            --admission-receipt "${RUNNER_TEMP}/admission-receipt.json" \
            --compose-env "${RUNNER_TEMP}/prepared/compose.env" \
            --backend-env "${RUNNER_TEMP}/prepared/backend.env" \
            --deploy-root "${DEPLOY_ROOT}" \
            --output-root "${DEPLOY_ROOT}/source-free-inputs/source-free-${GITHUB_RUN_ID}" \
            --operation-directory "${DEPLOY_ROOT}/release-receipts/source-free-${GITHUB_RUN_ID}" \
            --request-output "${RUNNER_TEMP}/fixed-host-request.json" \
            --platform-revision "${GITHUB_SHA}" \
            --traffic-generation "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --project-name "${{ vars.DEPLOY_COMPOSE_PROJECT }}" \
            > "${RUNNER_TEMP}/preparation-result.json"
          node tools/platform/run-fixed-host-journey-activation.mjs \
            --request "${RUNNER_TEMP}/fixed-host-request.json" \
            > "${RUNNER_TEMP}/cutover-result.json"
          cat "${RUNNER_TEMP}/cutover-result.json" >> "${GITHUB_STEP_SUMMARY}"
