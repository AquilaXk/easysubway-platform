name: Platform CI

on:
  # automerge-queue가 same-repository head의 required context 누락을 복구하려고
  # gh workflow run ci.yml을 호출한다.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  platform:
    name: Platform CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          # 워크플로를 실제 YAML 파서로 읽는 유일한 게이트다. run 블록의 block scalar가
          # 깨져 스크립트 일부가 YAML 구조로 새어 나가는 파손은 텍스트 기반 계약 테스트로는
          # 잡히지 않는다. 이미지는 다른 pin과 같은 규칙으로 digest 고정한다.
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Stage pinned contracts
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "${RUNNER_TEMP}/platform-contracts.json" \
            https://raw.githubusercontent.com/AquilaXk/easysubway/main/contracts/bundles/platform-contracts-v1.0.0.json
          node tools/platform/stage-contracts.mjs \
            --lock contracts.lock.json \
            --input "${RUNNER_TEMP}/platform-contracts.json" \
            --output build/contracts

      - name: Test platform contracts
        run: |
          node --test tools/ci/automerge-queue.test.mjs
          node --test tools/platform/stage-contracts.test.mjs
          node --test tools/platform/validate-deployment-input.test.mjs
          node --test tools/ops/post-deploy-smoke.test.mjs

      - name: Validate production Compose
        env:
          EASYSUBWAY_BACKEND_ENV_FILE: /dev/null
          EASYSUBWAY_BACKEND_IMAGE: ghcr.io/aquilaxk/easysubway-backend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          EASYSUBWAY_ROUTE_V2_ORIGIN_SECRET: ci-only
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Check shell syntax
        run: |
          bash -n infra/nginx/route-v2-entrypoint.sh
          bash -n tools/deploy/deploy-backend.sh
          bash -n tools/deploy/prepare-deployment-env.sh
          bash -n tools/ops/data-source-raw-archive.sh
          bash -n tools/ops/facility-report-photo-backup.sh
          bash -n tools/ops/postgres-backup.sh
          bash -n tools/ops/postgres-restore-rehearsal.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.14.6

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
