name: Source-free Journey K3s Deploy

# run 목록 API는 workflow_dispatch 입력을 돌려주지 않는다. 직전 활성 release와 되돌리기 입력을 API로 읽을 수 있도록
# mode와 backend/data 입력 id를 고정 형식으로 run 이름에 남긴다(data 체인이 정규식으로만 해석한다, platform#242).
# sha256과 artifact 이름은 소비자가 artifacts API(name, digest)에서 다시 구한다.
# run-name은 dispatch 입력에서 만들어지는 인증되지 않은 기록이다(행위자 확인보다 먼저 정해진다). 제목만으로 직전 활성 release를 고르면 안 되고,
# 소비자(data 체인 tools/ci/datapack-release-chain.mjs)는 제목과 함께 conclusion=success, event=workflow_dispatch, head_branch=main,
# triggering_actor가 허용 목록(릴리스 체인 App·저장소 소유자)인 run만 DEPLOY 기록으로 인정해야 한다. 이 조건은 소비자 계약 테스트가 고정한다.
run-name: ${{ format('{0} backend={1}/{2} data={3}/{4}', inputs.mode, inputs.backend_run_id, inputs.backend_artifact_id, inputs.data_run_id, inputs.data_artifact_id) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Closed execution mode"
        required: true
        type: choice
        options:
          - PREVIEW
          - DEPLOY
      backend_run_id:
        description: "Exact Backend release workflow run ID"
        required: true
        type: string
      backend_artifact_id:
        description: "Exact Backend release artifact ID"
        required: true
        type: string
      backend_artifact_name:
        description: "Exact Backend release artifact name"
        required: true
        type: string
      backend_archive_sha256:
        description: "Exact Backend archive SHA-256"
        required: true
        type: string
      data_run_id:
        description: "Exact signed Data FINAL workflow run ID"
        required: true
        type: string
      data_artifact_id:
        description: "Exact signed Data FINAL artifact ID"
        required: true
        type: string
      data_artifact_name:
        description: "Exact signed Data FINAL artifact name"
        required: true
        type: string
      data_archive_sha256:
        description: "Exact signed Data FINAL archive SHA-256"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  source-free-k3s:
    name: ${{ inputs.mode == 'DEPLOY' && 'Activate source-free Journey on K3s' || 'Validate source-free K3s request' }}
    # 허용되지 않은 행위자의 dispatch는 환경·self-hosted 러너를 잡기 전에 job 단계에서 건너뛴다(concurrency도 job 단위라 건너뛴 job은 슬롯을 차지하지 않는다).
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.triggering_actor == 'easysubway-release-chain[bot]' || github.triggering_actor == 'AquilaXk')
    concurrency:
      group: source-free-journey-k3s-production
      cancel-in-progress: false
    environment: production-deploy
    runs-on: ${{ fromJSON(inputs.mode == 'DEPLOY' && '["self-hosted","Linux","ARM64","easysubway-production"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      # 환경의 사람 승인이 없어도 허용된 행위자만 진행한다. 재실행한 사람이 원 dispatch 행위자를 가장하지 못하도록 triggering_actor를 쓴다.
      - name: Require an authorized dispatcher
        shell: bash
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          case "${TRIGGERING_ACTOR}" in
            "easysubway-release-chain[bot]"|"AquilaXk") ;;
            *) echo "deploy dispatcher is not authorized: ${TRIGGERING_ACTOR}" >&2; exit 1 ;;
          esac

      - name: Checkout Platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Download exact Backend archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.backend_artifact_id }}
          run-id: ${{ inputs.backend_run_id }}
          repository: AquilaXk/easysubway-backend
          github-token: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          path: ${{ runner.temp }}/backend-archive
          skip-decompress: true

      - name: Download exact signed Data FINAL archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.data_artifact_id }}
          run-id: ${{ inputs.data_run_id }}
          repository: AquilaXk/easysubway-data
          github-token: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          path: ${{ runner.temp }}/data-archive
          skip-decompress: true

      - name: Validate immutable artifacts and prepare K3s request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EASYSUBWAY_RELEASE_ARTIFACTS_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EASYSUBWAY_ENV: ${{ secrets.EASYSUBWAY_ENV }}
          EASYSUBWAY_DATAPACK_WORKFLOW_TOKEN: ${{ inputs.mode == 'DEPLOY' && secrets.EASYSUBWAY_DATAPACK_WORKFLOW_TOKEN || '' }}
          EASYSUBWAY_DATAPACK_CALLBACK_HMAC_KEY: ${{ inputs.mode == 'DEPLOY' && secrets.EASYSUBWAY_DATAPACK_CALLBACK_HMAC_KEY || '' }}
          MODE: ${{ inputs.mode }}
          CONFIGURED_DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          NODE_INTERNAL_IP: ${{ vars.PRODUCTION_NODE_INTERNAL_IP }}
          PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
          DEPLOY_COMPOSE_PROJECT: ${{ vars.DEPLOY_COMPOSE_PROJECT }}
          BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
          BACKEND_ARTIFACT_ID: ${{ inputs.backend_artifact_id }}
          BACKEND_ARTIFACT_NAME: ${{ inputs.backend_artifact_name }}
          BACKEND_ARCHIVE_SHA256: ${{ inputs.backend_archive_sha256 }}
          DATA_RUN_ID: ${{ inputs.data_run_id }}
          DATA_ARTIFACT_ID: ${{ inputs.data_artifact_id }}
          DATA_ARTIFACT_NAME: ${{ inputs.data_artifact_name }}
          DATA_ARCHIVE_SHA256: ${{ inputs.data_archive_sha256 }}
        run: |
          set -euo pipefail
          backend_metadata="$(gh api "repos/AquilaXk/easysubway-backend/actions/artifacts/${BACKEND_ARTIFACT_ID}" --jq '[.name, (.workflow_run.id|tostring), (.expired|tostring)] | @tsv')"
          data_metadata="$(gh api "repos/AquilaXk/easysubway-data/actions/artifacts/${DATA_ARTIFACT_ID}" --jq '[.name, (.workflow_run.id|tostring), (.expired|tostring)] | @tsv')"
          backend_run_metadata="$(gh api "repos/AquilaXk/easysubway-backend/actions/runs/${BACKEND_RUN_ID}" --jq '[.path, .conclusion, .head_branch, .head_sha] | @tsv')"
          data_run_metadata="$(gh api "repos/AquilaXk/easysubway-data/actions/runs/${DATA_RUN_ID}" --jq '[.path, .conclusion, .head_branch, .head_sha] | @tsv')"
          IFS=$'\t' read -r backend_workflow backend_conclusion backend_branch backend_producer_sha <<< "${backend_run_metadata}"
          IFS=$'\t' read -r data_workflow data_conclusion data_branch data_producer_sha <<< "${data_run_metadata}"
          [[ "${backend_metadata}" == "${BACKEND_ARTIFACT_NAME}"$'\t'"${BACKEND_RUN_ID}"$'\tfalse' ]]
          [[ "${data_metadata}" == "${DATA_ARTIFACT_NAME}"$'\t'"${DATA_RUN_ID}"$'\tfalse' ]]
          [[ "${backend_workflow}" == ".github/workflows/release-artifacts.yml" && "${backend_conclusion}" == "success" && "${backend_branch}" == "main" && "${backend_producer_sha}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${data_workflow}" == ".github/workflows/datapack-release.yml" && "${data_conclusion}" =~ ^(success|failure)$ && "${data_branch}" == "main" && "${data_producer_sha}" =~ ^[a-f0-9]{40}$ ]]
          mapfile -t backend_archives < <(find "${RUNNER_TEMP}/backend-archive" -maxdepth 1 -type f -print)
          mapfile -t data_archives < <(find "${RUNNER_TEMP}/data-archive" -maxdepth 1 -type f -print)
          [[ "${#backend_archives[@]}" -eq 1 && "${#data_archives[@]}" -eq 1 ]]
          [[ "$(sha256sum "${backend_archives[0]}" | cut -d ' ' -f 1)" == "${BACKEND_ARCHIVE_SHA256}" ]]
          [[ "$(sha256sum "${data_archives[0]}" | cut -d ' ' -f 1)" == "${DATA_ARCHIVE_SHA256}" ]]
          [[ -n "${NODE_INTERNAL_IP}" && -n "${PUBLIC_BASE_URL}" && -n "${DEPLOY_COMPOSE_PROJECT}" ]]

          mkdir -p "${RUNNER_TEMP}/backend" "${RUNNER_TEMP}/data" "${RUNNER_TEMP}/prepared"
          unzip -q "${backend_archives[0]}" -d "${RUNNER_TEMP}/backend"
          unzip -q "${data_archives[0]}" -d "${RUNNER_TEMP}/data"
          printf '%s' "${EASYSUBWAY_ENV}" > "${RUNNER_TEMP}/deployment.env"
          chmod 600 "${RUNNER_TEMP}/deployment.env"
          if [[ "${MODE}" == "DEPLOY" ]]; then
            node tools/platform/inject-datapack-callback-secrets.mjs
          fi
          node tools/platform/inject-journey-runtime-settings.mjs
          tools/deploy/prepare-deployment-env.sh \
            "${RUNNER_TEMP}/deployment.env" \
            tools/deploy/compose-server-env.allowlist \
            tools/deploy/backend-app-env.allowlist \
            "${RUNNER_TEMP}/prepared"
          if [[ "${MODE}" == "PREVIEW" ]]; then
            deploy_root="${RUNNER_TEMP}/source-free-k3s-preview"
          else
            [[ -n "${CONFIGURED_DEPLOY_ROOT}" ]]
            deploy_root="${CONFIGURED_DEPLOY_ROOT}"
          fi
          source_free_root="${deploy_root}/source-free-inputs/source-free-k3s-${GITHUB_RUN_ID}"
          platform_contract_root="${deploy_root}/source-free-inputs/platform-contracts-${GITHUB_RUN_ID}"
          operation_directory="${deploy_root}/release-receipts/source-free-k3s-${GITHUB_RUN_ID}"
          mkdir -p "${deploy_root}/source-free-inputs" "${deploy_root}/release-receipts"
          chmod 700 "${deploy_root}/source-free-inputs" "${deploy_root}/release-receipts"
          node tools/platform/acquire-platform-contract-bundle.mjs \
            --output-root "${platform_contract_root}" \
            > "${RUNNER_TEMP}/platform-contract-bundle-acquisition.json"
          node tools/platform/verify-production-deploy-effective-admission-receipt.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --workflow-sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${RUNNER_TEMP}/admission-receipt.json"
          node tools/platform/prepare-source-free-fixed-host-deployment.mjs \
            --mode "${MODE}" \
            --backend-artifact-root "${RUNNER_TEMP}/backend" \
            --data-artifact-root "${RUNNER_TEMP}/data" \
            --admission-receipt "${RUNNER_TEMP}/admission-receipt.json" \
            --compose-env "${RUNNER_TEMP}/prepared/compose.env" \
            --backend-env "${RUNNER_TEMP}/prepared/backend.env" \
            --deploy-root "${deploy_root}" \
            --output-root "${source_free_root}" \
            --operation-directory "${operation_directory}" \
            --request-output "${RUNNER_TEMP}/fixed-host-validation-request.json" \
            --backend-producer-sha "${backend_producer_sha}" \
            --data-producer-sha "${data_producer_sha}" \
            --platform-revision "${GITHUB_SHA}" \
            --traffic-generation "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --project-name "${DEPLOY_COMPOSE_PROJECT}" \
            > "${RUNNER_TEMP}/source-free-validation.json"
          node tools/platform/prepare-source-free-k3s-deployment.mjs \
            --mode "${MODE}" \
            --fixed-host-request "${RUNNER_TEMP}/fixed-host-validation-request.json" \
            --candidate-input-output "${RUNNER_TEMP}/k3s-candidate-input.json" \
            --request-output "${RUNNER_TEMP}/k3s-activation-request.json" \
            --node-internal-ip "${NODE_INTERNAL_IP}" \
            --public-base-url "${PUBLIC_BASE_URL}" \
            --platform-contract-bundle "${platform_contract_root}" \
            > "${RUNNER_TEMP}/k3s-preparation.json"
          cat "${RUNNER_TEMP}/k3s-preparation.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Activate exact Journey release on K3s
        if: inputs.mode == 'DEPLOY'
        shell: bash
        env:
          EASYSUBWAY_JOURNEY_READINESS_SERVICE_TOKEN: ${{ secrets.EASYSUBWAY_JOURNEY_READINESS_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          node tools/platform/run-k3s-journey-activation.mjs \
            --request "${RUNNER_TEMP}/k3s-activation-request.json" \
            > "${RUNNER_TEMP}/k3s-activation-result.json"
          cat "${RUNNER_TEMP}/k3s-activation-result.json" >> "${GITHUB_STEP_SUMMARY}"
