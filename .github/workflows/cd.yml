name: CD

on:
  workflow_run:
    workflows:
      - Release Artifacts
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - preflight
      deploy_sha:
        description: "배포할 main 커밋 SHA. 비우면 현재 workflow SHA를 사용합니다."
        required: false
        type: string
      rollback_image_digest:
        description: "exact release artifact가 없는 긴급 rollback용 immutable sha256 digest"
        required: false
        type: string

jobs:
  plan:
    name: CD Plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy_target_relevant: ${{ steps.changes.outputs.deploy }}
      sha: ${{ steps.target.outputs.sha }}
      producer_run_id: ${{ steps.target.outputs.producer_run_id }}
      image_digest: ${{ steps.manifest.outputs.image_digest || steps.target.outputs.rollback_image_digest }}
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}

    steps:
      - name: CD Plan / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: CD Plan / Resolve deployment target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_SHA: ${{ inputs.deploy_sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          ROLLBACK_IMAGE_DIGEST: ${{ inputs.rollback_image_digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rollback_image_digest=""
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            deploy_sha="${WORKFLOW_RUN_SHA}"
            producer_run_id="${WORKFLOW_RUN_ID}"
            mode="deploy"
          else
            deploy_sha="${DISPATCH_SHA:-${GITHUB_SHA}}"
            if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "invalid deploy sha: ${deploy_sha}" >&2
              exit 1
            fi
            producer_runs="${RUNNER_TEMP}/release-artifacts-runs.json"
            curl -fsS \
              --connect-timeout 5 \
              --max-time 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "${producer_runs}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-artifacts.yml/runs?head_sha=${deploy_sha}&branch=main&event=push&status=success&per_page=20"
            producer_run_id=""
            if validated_run="$(node tools/ci/require-successful-workflow-run.mjs \
              "${producer_runs}" "${deploy_sha}" "Release Artifacts" "push" main 1209600)"; then
              producer_run_id="${validated_run#validated_workflow_run_id=}"
            else
              run_status="$?"
              if (( run_status == 3 )); then
                :
              else
                exit "${run_status}"
              fi
            fi
            if [[ -n "${producer_run_id}" ]]; then
              artifact_name="easysubway-backend-release-${deploy_sha}"
              producer_artifacts="${RUNNER_TEMP}/backend-release-artifacts.json"
              curl -fsS \
                --connect-timeout 5 \
                --max-time 20 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --output "${producer_artifacts}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100"
              if node tools/ci/require-workflow-artifact.mjs \
                "${producer_artifacts}" "${artifact_name}" "${producer_run_id}" "${deploy_sha}"; then
                :
              else
                artifact_status="$?"
                if (( artifact_status == 3 )); then
                  producer_run_id=""
                else
                  exit "${artifact_status}"
                fi
              fi
            fi
            if [[ -z "${producer_run_id}" ]]; then
              rollback_image_digest="${ROLLBACK_IMAGE_DIGEST}"
              if [[ ! "${rollback_image_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "manual rollback without an exact Release Artifacts run requires rollback_image_digest" >&2
                exit 1
              fi
            fi
            mode="${DISPATCH_MODE:-deploy}"
          fi

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid deploy sha: ${deploy_sha}" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${deploy_sha}" origin/main; then
            echo "deploy target is not on origin/main: ${deploy_sha}" >&2
            exit 1
          fi

          echo "sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"
          echo "producer_run_id=${producer_run_id}" >> "${GITHUB_OUTPUT}"
          echo "rollback_image_digest=${rollback_image_digest}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: CD Plan / Detect deployment changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "manual dispatch deploys the requested main SHA" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if git rev-parse "${DEPLOY_SHA}^" >/dev/null 2>&1; then
            git diff --name-only "${DEPLOY_SHA}^" "${DEPLOY_SHA}" > changed-files.txt
          else
            git diff-tree --root --name-only "${DEPLOY_SHA}" > changed-files.txt
          fi
          bash tools/ci/detect-changed-paths.sh changed-files.txt

      - name: CD Plan / Download exact backend release artifact
        if: ${{ steps.changes.outputs.deploy == 'true' && steps.target.outputs.rollback_image_digest == '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-backend-release-${{ steps.target.outputs.sha }}
          path: ${{ runner.temp }}/backend-release
          run-id: ${{ steps.target.outputs.producer_run_id }}
          github-token: ${{ github.token }}

      - name: CD Plan / Validate backend component manifest
        id: manifest
        if: ${{ steps.changes.outputs.deploy == 'true' && steps.target.outputs.rollback_image_digest == '' }}
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          MANIFEST_PATH: ${{ runner.temp }}/backend-release/backend-component-manifest.json
          EVIDENCE_PATH: ${{ runner.temp }}/backend-release/release-metadata.txt
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE' >> "${GITHUB_OUTPUT}"
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile(process.env.MANIFEST_PATH, "utf8"));
          const evidence = await readFile(process.env.EVIDENCE_PATH);
          const digest = manifest?.artifactIdentity?.imageDigest;
          if (
            manifest?.schemaVersion !== 1 ||
            manifest?.component !== "backend" ||
            manifest?.repository !== process.env.GITHUB_REPOSITORY ||
            manifest?.gitSha !== process.env.DEPLOY_SHA ||
            manifest?.contractVersion !== "1.0.0" ||
            manifest?.artifactIdentity?.apiContractVersion !== manifest.contractVersion ||
            !/^sha256:[a-f0-9]{64}$/.test(digest ?? "") ||
            !/^[a-f0-9]{64}$/.test(manifest?.evidenceSha256 ?? "") ||
            createHash("sha256").update(evidence).digest("hex") !== manifest.evidenceSha256
          ) throw new Error("backend component manifest is invalid for the exact producer run");
          process.stdout.write(`image_digest=${digest}\n`);
          NODE

  deploy:
    name: CD Deploy
    needs:
      - plan
    runs-on:
      - self-hosted
      - easysubway-production
    permissions:
      actions: read
      contents: read
      packages: read
    environment:
      name: production-cd
      url: ${{ vars.DEPLOY_PUBLIC_API_BASE_URL }}
    concurrency:
      group: cd-production-deploy
      cancel-in-progress: false
    if: ${{ needs.plan.outputs.deploy_target_relevant == 'true' }}
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      deploy_ready: ${{ steps.remote.outputs.deploy_ready }}
      route_v2_ingress_enabled: ${{ steps.ingress-state.outputs.enabled }}

    steps:
      - name: CD Deploy / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: CD Deploy / Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: CD Deploy / Resolve deployment target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.deploy_sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            deploy_sha="${WORKFLOW_RUN_SHA}"
            mode="deploy"
          else
            deploy_sha="${DISPATCH_SHA:-${GITHUB_SHA}}"
            mode="${DISPATCH_MODE:-deploy}"
          fi

          if [[ ! "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid deploy sha: ${deploy_sha}" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${deploy_sha}" origin/main; then
            echo "deploy target is not on origin/main: ${deploy_sha}" >&2
            exit 1
          fi
          git checkout --detach "${deploy_sha}"

          echo "sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "DEPLOY_SHA=${deploy_sha}" >> "${GITHUB_ENV}"

      - name: CD Deploy / Detect route purge migration
        id: route-purge
        shell: bash
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${DEPLOY_ROOT:-/opt/easysubway}"
          if [[ ! "${DEPLOY_ROOT}" =~ ^/[A-Za-z0-9._/-]+$ || "${DEPLOY_ROOT}" == *..* ]]; then
            echo "DEPLOY_ROOT is invalid" >&2
            exit 1
          fi
          if [[ ! -f "${DEPLOY_ROOT}/shared/current-sha" ]]; then
            echo "required=false" >> "${GITHUB_OUTPUT}"
            echo "current_sha=" >> "${GITHUB_OUTPUT}"
            echo "route purge snapshot is not required without a managed deployment baseline" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          current_sha="$(<"${DEPLOY_ROOT}/shared/current-sha")"
          if [[ ! "${current_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deployed SHA marker is invalid" >&2
            exit 1
          fi
          if ! git cat-file -e "${current_sha}^{commit}"; then
            echo "deployed SHA is unavailable in the repository" >&2
            exit 1
          fi

          route_purge_changes="${RUNNER_TEMP}/route-purge-migration-changes.txt"
          git diff --name-only "${current_sha}" "${DEPLOY_SHA}" -- \
            backend/src/main/resources/db/migration/postgresql \
            backend/src/main/resources/db/migration/h2 \
            > "${route_purge_changes}"
          target_migrations="${RUNNER_TEMP}/target-migrations.txt"
          git ls-tree -r --name-only "${DEPLOY_SHA}" -- \
            backend/src/main/resources/db/migration/postgresql \
            backend/src/main/resources/db/migration/h2 \
            > "${target_migrations}"

          required=false
          if grep -Eq '^backend/src/main/resources/db/migration/(postgresql|h2)/V51__' "${route_purge_changes}" && \
             grep -Eq '^backend/src/main/resources/db/migration/(postgresql|h2)/V51__' "${target_migrations}"; then
            required=true
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          echo "current_sha=${current_sha}" >> "${GITHUB_OUTPUT}"

      - name: CD Deploy / Check migration DDL compatibility
        shell: bash
        run: |
          set -euo pipefail
          # blue/green standby는 구 canonical과 같은 live Postgres에 대해 부팅하며 배포 대상
          # 마이그레이션을 커밋하므로, 배포 대상 checkout에서 파괴적 DDL을 다시 확인한다(#2365).
          # pre-#2365 SHA로 롤백 재배포되면 검사기 파일이 배포 대상에 없다. 이때는
          # module-not-found로 job을 깨뜨리지 말고 로그 한 줄 남기고 skip한다.
          if [[ ! -f tools/ci/check-migration-ddl-compat.mjs ]]; then
            echo "migration DDL gate absent at deploy target (pre-#2365 SHA); skipping"
            exit 0
          fi
          node tools/ci/check-migration-ddl-compat.mjs

      - name: CD Deploy / Require route purge snapshot evidence
        if: ${{ steps.route-purge.outputs.required == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          CURRENT_DEPLOYED_SHA: ${{ steps.route-purge.outputs.current_sha }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${DEPLOY_ROOT:-/opt/easysubway}"
          if [[ ! "${DEPLOY_ROOT}" =~ ^/[A-Za-z0-9._/-]+$ || "${DEPLOY_ROOT}" == *..* ]]; then
            echo "DEPLOY_ROOT is invalid" >&2
            exit 1
          fi
          if [[ ! "${CURRENT_DEPLOYED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "snapshot source deployed SHA is invalid" >&2
            exit 1
          fi

          snapshot_runs_file="${RUNNER_TEMP}/route-purge-snapshot-runs.json"
          snapshot_wait_deadline="$((SECONDS + 3600))"
          while true; do
            if curl -fsS \
              --connect-timeout 5 \
              --max-time 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "${snapshot_runs_file}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/production-route-api-closure-evidence.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&status=success&per_page=20"; then
              if node tools/ci/require-successful-workflow-run.mjs \
                "${snapshot_runs_file}" \
                "${DEPLOY_SHA}" \
                "Production route API closure evidence" \
                "push,workflow_dispatch" \
                main \
                3600; then
                break
              fi
            else
              echo "snapshot evidence query failed; retrying within bounded deadline" >&2
            fi
            if (( SECONDS >= snapshot_wait_deadline )); then
              echo "timed out waiting for route purge snapshot evidence" >&2
              exit 1
            fi
            sleep 15
          done

          marker_file="${DEPLOY_ROOT}/shared/1913-route-purge-snapshot/snapshot-${DEPLOY_SHA}.env"
          if [[ ! -f "${marker_file}" ]]; then
            echo "route purge snapshot marker is missing" >&2
            exit 1
          fi

          marker_value() {
            local key="${1:?marker key is required}"
            local value
            value="$(sed -n "s/^${key}=//p" "${marker_file}")"
            if [[ -z "${value}" || "${value}" == *$'\n'* ]]; then
              echo "snapshot marker field ${key} is missing or duplicated" >&2
              exit 1
            fi
            printf '%s\n' "${value}"
          }

          marker_status="$(marker_value status)"
          marker_request_sha="$(marker_value snapshot_request_sha)"
          marker_deployed_sha="$(marker_value deployed_sha)"
          marker_image_revision="$(marker_value image_revision)"
          marker_postgresql_major="$(marker_value postgresql_major)"
          marker_schema_version="$(marker_value schema_version)"
          marker_purge_sql_sha="$(marker_value purge_sql_sha256)"
          backup_file="$(marker_value backup_file)"
          marker_backup_sha="$(marker_value backup_sha256)"

          current_image_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "easysubway-backend:${CURRENT_DEPLOYED_SHA}")"
          current_postgresql_version_num="$(docker exec easysubway-postgres sh -lc \
            'psql -X -v ON_ERROR_STOP=1 -A -t -U "$POSTGRES_USER" "$POSTGRES_DB" -c "SHOW server_version_num;"' \
            | tr -d '[:space:]')"
          current_postgresql_major="${current_postgresql_version_num:0:2}"
          current_schema_version="$(docker exec easysubway-postgres sh -lc \
            'psql -X -v ON_ERROR_STOP=1 -A -t -U "$POSTGRES_USER" "$POSTGRES_DB" -c "SELECT version FROM flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1;"' \
            | tr -d '[:space:]')"
          current_purge_sql_sha="$(sha256sum tools/ops/route-search-purge.sql | awk '{print $1}')"

          if [[ "${marker_status}" != "snapshot-complete" ]]; then
            echo "route purge snapshot marker is incomplete" >&2
            exit 1
          fi
          if [[ "${marker_request_sha}" != "${DEPLOY_SHA}" ]]; then
            echo "snapshot marker request SHA does not match deploy SHA" >&2
            exit 1
          fi
          if [[ "${marker_deployed_sha}" != "${CURRENT_DEPLOYED_SHA}" ]]; then
            echo "snapshot marker source SHA does not match current production SHA" >&2
            exit 1
          fi
          if [[ "${marker_image_revision}" != "${current_image_revision}" ]]; then
            echo "snapshot marker image revision does not match current production" >&2
            exit 1
          fi
          if [[ "${marker_postgresql_major}" != "${current_postgresql_major}" ]]; then
            echo "snapshot marker PostgreSQL major does not match current production" >&2
            exit 1
          fi
          if [[ "${marker_schema_version}" != "${current_schema_version}" ]]; then
            echo "snapshot marker schema version does not match current production" >&2
            exit 1
          fi
          if [[ "${marker_purge_sql_sha}" != "${current_purge_sql_sha}" ]]; then
            echo "snapshot marker purge SQL checksum does not match deploy target" >&2
            exit 1
          fi
          case "${backup_file}" in
            "${DEPLOY_ROOT}/backups/postgres/1913-route-purge/"*.dump) ;;
            *)
              echo "snapshot marker backup path is invalid" >&2
              exit 1
              ;;
          esac
          if [[ ! -f "${backup_file}" || ! -f "${backup_file}.sha256" ]]; then
            echo "snapshot marker backup is missing" >&2
            exit 1
          fi
          if [[ ! "${marker_backup_sha}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "snapshot marker backup checksum is invalid" >&2
            exit 1
          fi
          actual_backup_sha="$(sha256sum "${backup_file}" | awk '{print $1}')"
          if [[ "${marker_backup_sha}" != "${actual_backup_sha}" ]]; then
            echo "snapshot marker backup checksum mismatch" >&2
            exit 1
          fi
          echo "validated_route_purge_snapshot_sha=${DEPLOY_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: CD Deploy / Validate manual dispatch CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ci_runs="$(
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${DEPLOY_SHA}&branch=main&event=push&status=success&per_page=20"
          )"
          if ! grep -q '"name": "CI"' <<< "${ci_runs}"; then
            echo "manual deployment requires a successful CI workflow for ${DEPLOY_SHA}" >&2
            exit 1
          fi

          echo "validated_ci_sha=${DEPLOY_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: CD Deploy / Restore GitHub Actions dotenv secret
        id: dotenv
        shell: bash
        env:
          EASYSUBWAY_ENV_SECRET: ${{ secrets.EASYSUBWAY_ENV }}
          EASYSUBWAY_ADS_ASSET_ORIGIN: ${{ vars.EASYSUBWAY_ADS_ASSET_ORIGIN }}
          EASYSUBWAY_ADS_EVENT_DAILY_CAP: ${{ vars.EASYSUBWAY_ADS_EVENT_DAILY_CAP }}
          EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY_SECRET: ${{ secrets.EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY }}
          DATA_GO_KR_SERVICE_KEY_SECRET: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          env_file="${RUNNER_TEMP}/easysubway.env"
          if [[ -n "${EASYSUBWAY_ENV_SECRET}" ]]; then
            printf '%s' "${EASYSUBWAY_ENV_SECRET}" > "${env_file}"
            filtered_env_file="${RUNNER_TEMP}/easysubway.filtered.env"
            drop_topis_key=false
            [[ -n "${EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY_SECRET}" ]] && drop_topis_key=true
            drop_tago_key=false
            [[ -n "${DATA_GO_KR_SERVICE_KEY_SECRET}" ]] && drop_tago_key=true
            awk -F= -v drop_topis_key="${drop_topis_key}" -v drop_tago_key="${drop_tago_key}" '
              BEGIN {
                drop["EASYSUBWAY_SEOUL_TOPIS_CALL_LIMIT_PER_MINUTE"] = 1
                drop["EASYSUBWAY_SEOUL_TOPIS_CALL_LIMIT_PER_DAY"] = 1
                drop["EASYSUBWAY_TAGO_TRAIN_CALL_LIMIT_PER_MINUTE"] = 1
                drop["EASYSUBWAY_TAGO_TRAIN_CALL_LIMIT_PER_DAY"] = 1
                drop["EASYSUBWAY_TRAIN_SEARCH_RATE_LIMIT_PER_DAY"] = 1
                drop["EASYSUBWAY_TRUSTED_PROXY_CIDRS"] = 1
                if (drop_topis_key == "true") {
                  drop["EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY"] = 1
                }
                if (drop_tago_key == "true") {
                  drop["EASYSUBWAY_TAGO_TRAIN_SERVICE_KEY"] = 1
                }
              }
              !($1 in drop)
            ' "${env_file}" > "${filtered_env_file}"
            mv "${filtered_env_file}" "${env_file}"
            [[ -s "${env_file}" && "$(tail -c 1 "${env_file}")" != "" ]] && printf '\n' >> "${env_file}"
            if [[ -n "${EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY_SECRET}" ]]; then
              if [[ "${EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY_SECRET}" == *$'\n'* || "${EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY_SECRET}" == *$'\r'* ]]; then
                echo "EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY secret must be a single line" >&2
                exit 1
              fi
              printf '\nEASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY=%s\n' "${EASYSUBWAY_SEOUL_TOPIS_SERVICE_KEY_SECRET}" >> "${env_file}"
            fi
            printf 'EASYSUBWAY_SEOUL_TOPIS_CALL_LIMIT_PER_MINUTE=1\n' >> "${env_file}"
            printf 'EASYSUBWAY_SEOUL_TOPIS_CALL_LIMIT_PER_DAY=800\n' >> "${env_file}"
            if [[ -n "${DATA_GO_KR_SERVICE_KEY_SECRET}" ]]; then
              if [[ "${DATA_GO_KR_SERVICE_KEY_SECRET}" == *$'\n'* || "${DATA_GO_KR_SERVICE_KEY_SECRET}" == *$'\r'* ]]; then
                echo "DATA_GO_KR_SERVICE_KEY secret must be a single line" >&2
                exit 1
              fi
              printf 'EASYSUBWAY_TAGO_TRAIN_SERVICE_KEY=%s\n' "${DATA_GO_KR_SERVICE_KEY_SECRET}" >> "${env_file}"
            fi
            printf 'EASYSUBWAY_TAGO_TRAIN_CALL_LIMIT_PER_MINUTE=60\n' >> "${env_file}"
            printf 'EASYSUBWAY_TAGO_TRAIN_CALL_LIMIT_PER_DAY=1000\n' >> "${env_file}"
            printf 'EASYSUBWAY_TRAIN_SEARCH_RATE_LIMIT_PER_DAY=64\n' >> "${env_file}"
            printf 'EASYSUBWAY_TRUSTED_PROXY_CIDRS=172.16.0.0/12\n' >> "${env_file}"
            echo "source=secret" >> "${GITHUB_OUTPUT}"
          else
            cp .env.example "${env_file}"
            echo "source=example" >> "${GITHUB_OUTPUT}"
            echo "::notice title=CD env secret::EASYSUBWAY_ENV secret is not configured; deployment will not start."
          fi

          for name in EASYSUBWAY_ADS_ASSET_ORIGIN EASYSUBWAY_ADS_EVENT_DAILY_CAP; do
            value="${!name}"
            if [[ -z "${value}" || "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "${name} repository variable must be a non-empty single line" >&2
              exit 1
            fi
          done

          filtered_env_file="${RUNNER_TEMP}/easysubway.ads-overlay.env"
          awk -F= '
            BEGIN {
              drop["EASYSUBWAY_ADS_ASSET_ORIGIN"] = 1
              drop["EASYSUBWAY_ADS_EVENT_DAILY_CAP"] = 1
              drop["EASYSUBWAY_BACKEND_BIND"] = 1
            }
            !($1 in drop)
          ' "${env_file}" > "${filtered_env_file}"
          mv "${filtered_env_file}" "${env_file}"
          printf 'EASYSUBWAY_BACKEND_BIND=127.0.0.1\n' >> "${env_file}"
          for name in EASYSUBWAY_ADS_ASSET_ORIGIN EASYSUBWAY_ADS_EVENT_DAILY_CAP; do
            value="${!name}"
            printf '%s=%s\n' "${name}" "${value}" >> "${env_file}"
          done

          chmod 600 "${env_file}"
          echo "EASYSUBWAY_ENV_FILE=${env_file}" >> "${GITHUB_ENV}"

      - name: CD Deploy / Validate deployment dotenv contract
        shell: bash
        run: |
          set -euo pipefail
          tools/ci/validate-deployment-env.sh "${EASYSUBWAY_ENV_FILE}"

      - name: CD Deploy / Prepare split deployment env files
        id: split-env
        if: ${{ steps.dotenv.outputs.source == 'secret' }}
        shell: bash
        run: |
          set -euo pipefail

          prepared_dir="${RUNNER_TEMP}/deploy-env"
          tools/deploy/prepare-deployment-env.sh \
            "${EASYSUBWAY_ENV_FILE}" \
            tools/deploy/compose-server-env.allowlist \
            tools/deploy/backend-app-env.allowlist \
            "${prepared_dir}"

          echo "dir=${prepared_dir}" >> "${GITHUB_OUTPUT}"
          echo "PREPARED_ENV_DIR=${prepared_dir}" >> "${GITHUB_ENV}"

      - name: CD Deploy / Validate Docker Compose deployment config
        if: ${{ steps.dotenv.outputs.source == 'secret' }}
        shell: bash
        run: |
          set -euo pipefail

          EASYSUBWAY_BACKEND_ENV_FILE="${PREPARED_ENV_DIR}/backend.env" \
            docker compose --env-file "${PREPARED_ENV_DIR}/compose.env" -f infra/docker-compose.yml config --quiet

      - name: CD Deploy / Validate TAGO train provider credential
        if: ${{ steps.dotenv.outputs.source == 'secret' }}
        shell: bash
        run: |
          set -euo pipefail
          node --env-file="${PREPARED_ENV_DIR}/backend.env" tools/ops/probe-tago-train-provider.mjs

      - name: CD Deploy / Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CD Deploy / Pull backend image by digest
        shell: bash
        env:
          IMAGE: ghcr.io/aquilaxk/easysubway-backend
          DEPLOY_IMAGE_DIGEST: ${{ needs.plan.outputs.image_digest }}
        run: |
          set -euo pipefail

          if [[ ! "${DEPLOY_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "plan did not produce a valid backend component digest" >&2
            exit 1
          fi

          # build-once, deploy-same: pull the exact digest CI pushed, then retag
          # to the local name the compose file and deploy script already expect,
          # so their --no-build and image-drift contracts are unchanged (#1686).
          docker pull "${IMAGE}@${DEPLOY_IMAGE_DIGEST}"
          docker tag "${IMAGE}@${DEPLOY_IMAGE_DIGEST}" "easysubway-backend:${DEPLOY_SHA}"
          image_revision="$(docker image inspect "easysubway-backend:${DEPLOY_SHA}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          if [[ "${image_revision}" != "${DEPLOY_SHA}" ]]; then
            echo "backend image revision does not match deploy SHA" >&2
            exit 1
          fi
          echo "DEPLOY_IMAGE_DIGEST=${DEPLOY_IMAGE_DIGEST}" >> "${GITHUB_ENV}"

      - name: CD Deploy / Rehearse PR1 image rollback after V51
        if: ${{ steps.route-purge.outputs.required == 'true' && steps.dotenv.outputs.source == 'secret' }}
        shell: bash
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          CURRENT_DEPLOYED_SHA: ${{ steps.route-purge.outputs.current_sha }}
          BACKEND_ENV_FILE: ${{ steps.split-env.outputs.dir }}/backend.env
        run: bash tools/ops/route-search-purge-rollback-rehearsal.sh

      - name: CD Deploy / Decide remote deploy readiness
        id: remote
        shell: bash
        env:
          MODE: ${{ steps.target.outputs.mode }}
          ENV_SOURCE: ${{ steps.dotenv.outputs.source }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_COMPOSE_PROJECT: ${{ vars.DEPLOY_COMPOSE_PROJECT }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${DEPLOY_ROOT:-/opt/easysubway}"
          DEPLOY_COMPOSE_PROJECT="${DEPLOY_COMPOSE_PROJECT:-easysubway}"
          deploy_ready=true
          reason="ready"
          if [[ "${MODE}" == "preflight" ]]; then
            deploy_ready=false
            reason="preflight_mode"
          elif [[ "${ENV_SOURCE}" != "secret" ]]; then
            deploy_ready=false
            reason="missing_easysubway_env"
          elif [[ ! "${DEPLOY_ROOT}" =~ ^/[A-Za-z0-9._/-]+$ || "${DEPLOY_ROOT}" == *..* ]]; then
            deploy_ready=false
            reason="invalid_deploy_root"
          elif [[ ! "${DEPLOY_COMPOSE_PROJECT}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            deploy_ready=false
            reason="invalid_compose_project"
          fi

          echo "deploy_ready=${deploy_ready}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "DEPLOY_ROOT=${DEPLOY_ROOT}" >> "${GITHUB_ENV}"
          echo "DEPLOY_COMPOSE_PROJECT=${DEPLOY_COMPOSE_PROJECT}" >> "${GITHUB_ENV}"

      - name: CD Deploy / Run local deployment
        if: ${{ steps.remote.outputs.deploy_ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          incoming="${DEPLOY_ROOT}/incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          install -m 700 -d "${incoming}"
          cp \
            "${PREPARED_ENV_DIR}/compose.env" \
            "${PREPARED_ENV_DIR}/backend.env" \
            tools/deploy/deploy-backend.sh \
            "${incoming}/"

          # Enforced here, not inside the checked-out target tree: redeploying a
          # HISTORICAL main SHA (issue #2095's rollback lock predates that SHA)
          # copies and runs THAT SHA's own tools/deploy/deploy-backend.sh, which
          # has no lock check at all and would silently re-open ingress from
          # compose.env's stale EASYSUBWAY_ROUTE_V2_INGRESS_ENABLED=true. This
          # step's script is loaded from the ref that dispatched/triggered this
          # CD run (not from deploy_sha), so it stays authoritative regardless of
          # which historical deploy-backend.sh gets copied above.
          if [[ -f "${DEPLOY_ROOT}/shared/route-v2-canary-rollback-lock.json" ]] \
            && ! grep -Fq 'route-v2-canary-rollback-lock.json' "${incoming}/deploy-backend.sh"; then
            echo 'Route V2 ingress is locked closed by a canary rollback lock (issue #2095), but the deploy tooling for this SHA predates lock enforcement; refusing to deploy until an operator resolves the lock or redeploys a SHA whose deploy-backend.sh enforces it' >&2
            exit 1
          fi

          DEPLOY_ROOT="${DEPLOY_ROOT}" \
            DEPLOY_COMPOSE_PROJECT="${DEPLOY_COMPOSE_PROJECT}" \
            DEPLOY_SHA="${DEPLOY_SHA}" \
            DEPLOY_IMAGE_DIGEST="${DEPLOY_IMAGE_DIGEST}" \
            INCOMING_DIR="${incoming}" \
            bash "${incoming}/deploy-backend.sh"

      - name: CD Deploy / Expose deployed Route V2 ingress state
        id: ingress-state
        if: ${{ steps.remote.outputs.deploy_ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          state_file="${DEPLOY_ROOT}/shared/current-route-v2-ingress-enabled"
          state="$(<"${state_file}")"
          if [[ "${state}" != "true" && "${state}" != "false" ]]; then
            echo "deployed Route V2 ingress state is invalid" >&2
            exit 1
          fi
          echo "enabled=${state}" >> "${GITHUB_OUTPUT}"

      # Public readiness is now one axis of the post-deploy-smoke job (below),
      # which runs on ubuntu-latest so it also verifies true external
      # reachability of the deployed URL (issue #1688). Local readiness is
      # already enforced inside deploy-backend.sh before the container swap.

      - name: CD Deploy / Summarize deployment result
        if: ${{ always() }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.plan.outputs.image_digest }}
        run: |
          set -euo pipefail

          {
            echo "### CD Deploy"
            echo "- target sha: ${DEPLOY_SHA:-unknown}"
            echo "- image digest: ${IMAGE_DIGEST:-unknown}"
            echo "- dotenv source: ${{ steps.dotenv.outputs.source || 'unknown' }}"
            echo "- mode: ${{ steps.target.outputs.mode || 'unknown' }}"
            echo "- remote deployment: ${{ steps.remote.outputs.deploy_ready == 'true' && 'started' || 'not_started' }}"
            echo "- remote reason: ${{ steps.remote.outputs.reason || 'not_evaluated' }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: CD Deploy / Cleanup sensitive files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EASYSUBWAY_ENV_FILE:-}" ]]; then
            rm -f "${EASYSUBWAY_ENV_FILE}"
          fi
          rm -rf "${RUNNER_TEMP}/deploy-env"

  post-deploy-smoke:
    name: Post-deploy smoke
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.deploy.outputs.deploy_ready == 'true' }}
    steps:
      - name: Post-deploy smoke / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Post-deploy smoke / Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Post-deploy smoke / Run core API smoke
        shell: bash
        env:
          DEPLOY_PUBLIC_API_BASE_URL: ${{ vars.DEPLOY_PUBLIC_API_BASE_URL }}
          ROUTE_V2_INGRESS_ENABLED: ${{ needs.deploy.outputs.route_v2_ingress_enabled }}
        run: |
          set -euo pipefail

          # A configured public base URL is required: "not configured, so it
          # passed" is not a gate (issue #1688). Set the repo variable
          # DEPLOY_PUBLIC_API_BASE_URL to the live deployment URL.
          if [[ -z "${DEPLOY_PUBLIC_API_BASE_URL}" ]]; then
            echo "::error title=Post-deploy smoke::DEPLOY_PUBLIC_API_BASE_URL repo variable is not configured." >&2
            exit 1
          fi

          # The datapack distribution URL is the contract default in
          # post-deploy-smoke-contract.json (the same OCI value pinned by the
          # repository contract test); no workflow var override is used.
          #
          # A public smoke failure is intentionally NOT auto-rolled back: local
          # readiness already passed inside deploy-backend.sh, so a failure here
          # is likely edge/DNS/datapack-URL and auto-reverting a healthy deploy
          # is the larger risk. The job fails and notify-slack-cd-result alerts.
          node tools/ops/post-deploy-smoke.mjs \
            --base-url "${DEPLOY_PUBLIC_API_BASE_URL}" \
            --route-v2-ingress-enabled "${ROUTE_V2_INGRESS_ENABLED}" \
            --timeout-seconds 90 \
            --report "${RUNNER_TEMP}/post-deploy-smoke-report.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Post-deploy smoke / Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-deploy-smoke-report
          path: ${{ runner.temp }}/post-deploy-smoke-report.json
          retention-days: 14
          if-no-files-found: ignore

  record-deploy:
    name: CD Record deployment
    needs: deploy
    runs-on: ubuntu-latest
    # Only this job may write refs; the self-hosted deploy job stays read-only.
    permissions:
      contents: write
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.deploy_ready == 'true' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: CD Record deployment / Tag deployed SHA
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "record-deploy received an invalid sha" >&2
            exit 1
          fi

          tag="deploy/backend/$(date -u +%Y%m%d-%H%M)-${DEPLOY_SHA:0:12}"
          # Lightweight tag on the deployed commit — GitHub-side deploy history
          # to complement the environment deployment record (issue #1687). Uses
          # curl (not gh) to match cd.yml's existing GitHub API convention.
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "{\"ref\":\"refs/tags/${tag}\",\"sha\":\"${DEPLOY_SHA}\"}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          {
            echo "### CD deployment recorded"
            echo "- sha: \`${DEPLOY_SHA}\`"
            echo "- tag: \`${tag}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify-slack-cd-result:
    name: Slack / CD result
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - plan
      - deploy
      - record-deploy
      - post-deploy-smoke
    if: >-
      ${{
        always() &&
        (needs.plan.result == 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      }}
    env:
      SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
    steps:
      - name: Slack / Skip missing release webhook
        if: ${{ env.SLACK_RELEASE_WEBHOOK_URL == '' }}
        run: echo "::notice title=Slack notification::SLACK_RELEASE_WEBHOOK_URL is not configured."

      - name: Slack / Notify CD result
        if: ${{ env.SLACK_RELEASE_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
        with:
          webhook: ${{ env.SLACK_RELEASE_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "EasySubway CD ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *EasySubway CD ${{ contains(needs.*.result, 'failure') && '실패' || contains(needs.*.result, 'cancelled') && '취소' || '성공' }}*
                    • repo: `${{ github.repository }}`
                    • ref: `${{ github.ref_name }}`
                    • sha: `${{ needs.deploy.outputs.sha || 'unknown' }}`
                    • tag: `${{ needs.record-deploy.outputs.tag || 'not_recorded' }}`
                    • actor: `${{ github.actor }}`
                    • run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions 열기>
