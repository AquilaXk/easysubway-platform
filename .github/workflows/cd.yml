name: CD Preflight

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: "ghcr.io/aquilaxk/easysubway-backend@sha256:<digest>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Digest-only deployment preflight
    if: github.ref == 'refs/heads/main'
    environment: production-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate immutable image and render Compose
        shell: bash
        env:
          EASYSUBWAY_BACKEND_ENV_FILE: /dev/null
          EASYSUBWAY_BACKEND_IMAGE: ${{ inputs.backend_image }}
          EASYSUBWAY_ROUTE_V2_ORIGIN_SECRET: preflight-only
        run: |
          if [[ ! "${EASYSUBWAY_BACKEND_IMAGE}" =~ ^ghcr\.io/aquilaxk/easysubway-backend@sha256:[a-f0-9]{64}$ ]]; then
            echo "backend_image must be an immutable EasySubway backend digest" >&2
            exit 1
          fi
          docker compose -f infra/docker-compose.yml config --quiet
