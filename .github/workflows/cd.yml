name: CD Preflight

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: "ghcr.io/aquilaxk/easysubway-backend@sha256:<digest>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Digest-only deployment preflight
    # 허용되지 않은 행위자의 dispatch는 환경·러너를 잡기 전에 job 단계에서 건너뛴다(concurrency도 job 단위라 건너뛴 job은 슬롯을 차지하지 않는다).
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.triggering_actor == 'AquilaXk'
    environment: production-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require an authorized dispatcher
        shell: bash
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "${TRIGGERING_ACTOR}" in
            "AquilaXk") ;;
            *) echo "deploy dispatcher is not authorized: ${TRIGGERING_ACTOR}" >&2; exit 1 ;;
          esac
          [[ "${DEPLOY_REF}" == "refs/heads/main" && "${RUN_ATTEMPT}" == "1" ]] || { echo "deploy must start from main on the first attempt" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate immutable image and render Compose
        shell: bash
        env:
          EASYSUBWAY_BACKEND_ENV_FILE: /dev/null
          EASYSUBWAY_BACKEND_IMAGE: ${{ inputs.backend_image }}
          EASYSUBWAY_ROUTE_V2_ORIGIN_SECRET: preflight-only
        run: |
          if [[ ! "${EASYSUBWAY_BACKEND_IMAGE}" =~ ^ghcr\.io/aquilaxk/easysubway-backend@sha256:[a-f0-9]{64}$ ]]; then
            echo "backend_image must be an immutable EasySubway backend digest" >&2
            exit 1
          fi
          docker compose -f infra/docker-compose.yml config --quiet
